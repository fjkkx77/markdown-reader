            ]);
        };

        let drawerOpen = false;
        const openDrawer = () => { drawerOpen = true; renderDrawer(); showLayer(overlay); drawer.style.transform = 'translateX(0)'; };
        const closeDrawer = () => {
            if (!drawerOpen) return;
            drawerOpen = false; hideLayer(overlay); drawer.style.transform = 'translateX(-100%)';
            // 还没到点的搜索计时作废，搜索词直接以输入框为准（下次打开时按它画）
            clearTimeout(searchTimer); searchQuery = searchInput.value.trim();
        };
        headerUI.btnHamburger.onclick = openDrawer; overlay.onclick = closeDrawer;

        // ================= 移动端边缘滑动呼出/关闭菜单 =================
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (window.innerWidth >= 768 || dialogOpen || folderDragging || suppressFolderClick) return;
            let touchEndX = e.changedTouches[0].screenX;
            // 边缘左滑(起始点小于40px)向右超过50px -> 打开抽屉
            if (touchStartX < 40 && touchEndX - touchStartX > 50 && !drawerOpen) {
                openDrawer();
            }
            // 抽屉打开时，向左滑动超过50px -> 关闭抽屉
            else if (drawerOpen && touchStartX - touchEndX > 50) {
                closeDrawer();
            }
        }, { passive: true });

        const openTocMobile = () => { showLayer(tocOverlay); tocSidebar.classList.add('mobile-open'); };
        const closeTocMobile = () => { if (!tocSidebar.classList.contains('mobile-open')) return; hideLayer(tocOverlay); tocSidebar.classList.remove('mobile-open'); };
        btnFabToc.onclick = openTocMobile;
        tocOverlay.onclick = closeTocMobile;

        headerUI.btnBack.onclick = () => { if(currentState === 'edit') cancelEdit(); else switchState('home'); };
        headerUI.headerLogo.onclick = () => switchState('home');
        headerUI.btnReadEdit.onclick = () => switchState('edit');
        headerUI.btnReadCopy.onclick = () => copyContent(headerUI.btnReadCopy);
        headerUI.btnReadDownload.onclick = () => downloadCurrent();
        headerUI.btnEditSave.onclick = () => saveEdit(); headerUI.btnEditCancel.onclick = () => cancelEdit(); headerUI.btnEditReset.onclick = () => resetEdit();

        function downloadCurrent() {
            if (!currentFile) return;
            const f = getDB().files.find(x => x.id === currentFile.id) || currentFile;
            downloadDoc(f);
        }

        // ================= 打开文档 / 离开编辑 =================
        // 所有「换一篇文档」的入口（侧边栏点文档、新建、导入、拖入、示例、首页继续阅读）都走这里，
        // 「有未保存修改先问一句」只在 confirmLeaveEdit 一处判断。原来侧边栏点文档、新建文档两条路
        // 没问就直接切走了，修改一声不响就没了（P1-1）。
        async function openDoc(id, opts = {}) {
            if (!opts.jump && !opts.force && currentState === 'read' && currentFile && currentFile.id === id) { closeDrawer(); return; }
            if (!opts.skipConfirm && !(await confirmLeaveEdit())) return;
            const file = getDB().files.find(f => f.id === id);
            if (!file) { notify('这篇文档已经不在了'); renderDrawer(); renderHomeContinue(); return; }
            currentFile = { ...file };
            closeDrawer(); closeTocMobile();
            await switchState('read');
            if (opts.jump && currentState === 'read' && currentFile.id === id) {
                const pos = getReadPos(id);
                if (pos) { hideResumePill(); restoreReadPos(pos); }
            }
        }

        // 编辑页有没保存的修改。没有「已经确认过」之类的标记：只要人还在编辑页、内容跟进来时不一样，
        // 就算有未保存的修改，下次离开照样会问（关页面也照样拦）。
        function hasUnsavedEdit() { return currentState === 'edit' && editorTextarea.value !== originalContent; }

        // 正在编辑的是哪篇（进入编辑页时记下）。离开编辑页时 switchState 按它删草稿。
        let editingId = null;

        // 返回 true 表示可以离开编辑页（没改动 / 已保存 / 选了不保存）。选「不保存」时这里不删草稿：
        // 调用方后面还可能半路放弃（新建时名字框点了取消、导入时同名点了取消），人还留在编辑页、改动还在，
        // 草稿得留着；真正离开编辑页时 switchState 才删。
        // 调用方拿到 true 之后，切换文档要走 skipConfirm（openDoc）或者直接 switchState，别再调一次本函数。
        async function confirmLeaveEdit() {
            if (!hasUnsavedEdit()) return true;
            const v = await ask({
                title: '有未保存的修改',
                message: `「${currentFile.title}」的修改还没保存。`,
                buttons: [
                    { text: '保存', value: 'save', bold: true },
                    { text: '不保存', value: 'discard', style: 'destructive' },
                    { text: '取消', value: 'cancel', style: 'cancel' }
                ]
            });
            if (v === 'save') return await commitEdit();
            if (v === 'discard') return true;
            return false;
        }

        // 把编辑框存进库。返回是否存上了。
        // 2026-10-09：①只在存上之后才更新内存里的 currentFile（原来先改内存再存，存失败点「放弃」时阅读页显示的是
        // 没存上的内容，之后关页面也不再提醒，P2-4）；②只改这一篇的内容和时间，标题/文件夹/置顶以库里最新的为准
        //（原来整条用手里的旧副本覆盖，别的页面刚改的名字会被改回去）；③编辑期间别的页面保存过这篇，先问再覆盖。
        async function commitEdit() {
            const id = currentFile.id;
            const content = editorTextarea.value;
            const stored = getDB().files.find(f => f.id === id);
            if (stored && stored.content !== originalContent && stored.content !== content) {
                const v = await ask({
                    title: '这篇文档在别处被改过',
                    message: '你编辑期间，另一个页面（或数学公式阅读器）保存过这篇文档。直接保存会覆盖那边的修改。',
                    buttons: [
                        { text: '另存为新文档', value: 'copy', bold: true },
                        { text: '覆盖保存', value: 'overwrite', style: 'destructive' },
                        { text: '取消', value: 'cancel', style: 'cancel' }
                    ]
                });
                if (v === 'copy') {
                    const copy = createFile(currentFile.title + '（我的版本）', content, SAVE_FAIL_EDIT);
                    if (!copy) return false;
                    clearDraft(id);
                    currentFile = { ...copy }; originalContent = content;
                    return true;
                }
                if (v !== 'overwrite') return false;
            }
            const ok = mutateDB(db => {
                const f = db.files.find(x => x.id === id);
                // 编辑期间这篇在别处被删了：按原来的 id 存回去，修改不丢
                if (!f) db.files.unshift({ id, title: currentFile.title, content, timestamp: Date.now(), isPinned: false, folderId: 'root' });
                else { f.content = content; f.timestamp = Date.now(); }
            }, SAVE_FAIL_EDIT);
            if (!ok) return false;
            currentFile = { ...getDB().files.find(x => x.id === id) };
            originalContent = content;
            clearDraft(id);
            return true;
        }

        async function saveEdit() { if (currentState !== 'edit') return; if (await commitEdit()) switchState('read'); }

        // 关标签页 / 刷新 / 离开时有未保存修改就让浏览器拦一下（浏览器只显示它自己的通用提示文字；
        // 这是唯一还用浏览器原生弹框的地方，网页没法自己画这个框）。iPhone 上这个拦截基本不起作用，靠下面的草稿兜底。
        window.addEventListener('beforeunload', (e) => { if (hasUnsavedEdit()) { saveDraftNow(); e.preventDefault(); e.returnValue = ''; } });
        async function cancelEdit() {
            if (editorTextarea.value !== originalContent && !(await confirmAsk('放弃修改？', '这次的修改不会保存。', '放弃', true))) return;
            clearDraft(currentFile.id);
            switchState('read');
        }
        async function resetEdit() {
            if (!(await confirmAsk('恢复到未修改前？', '编辑框会回到这次进入编辑时的内容。', '恢复', true))) return;
            editorTextarea.value = originalContent;
            clearDraft(currentFile.id);
            schedulePreview(true);
        }
        function copyContent(btnRef) {
            navigator.clipboard.writeText(currentFile.content).then(() => {
                if (btnRef) { btnRef.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(() => btnRef.innerHTML = '<i class="fas fa-copy"></i>', 2000); }
                else notify('已复制全文');
            }, () => notify('复制失败：浏览器不允许访问剪贴板'));
        }

        // ================= 自动草稿 =================
        // 原来只有点「保存」才存，iPhone 上关页面的拦截基本不起作用，误关页面、后台被杀改动就没了。
        // 编辑时停顿 0.8 秒、切到后台、关页面时，把编辑框存成这篇的草稿（单独的键，不动文档库）；
        // 下次进入这篇的编辑页会问要不要恢复，阅读页顶部也会提示。保存 / 放弃 / 删除时清掉。
        const DRAFT_PREFIX = 'mdr-draft:';
        let draftTimer = null;
        let pendingDraftRestore = null; // 从阅读页的草稿条点「继续编辑」进来的那篇：直接恢复，不再问
        function getDraft(id) {
            try { const d = JSON.parse(localStorage.getItem(DRAFT_PREFIX + id) || 'null'); return d && typeof d.content === 'string' ? d : null; }
            catch (_) { return null; }
        }
        function clearDraft(id) { clearTimeout(draftTimer); lsRemove(DRAFT_PREFIX + id); }
        function scheduleDraftSave() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraftNow, 800); }
        function saveDraftNow() {
            clearTimeout(draftTimer);
            if (currentState !== 'edit' || !currentFile) return;
            const v = editorTextarea.value;
            if (v === originalContent) { lsRemove(DRAFT_PREFIX + currentFile.id); return; }
            // 空间满了存不了草稿就算了，不打扰；真正点保存时会提示
            lsSet(DRAFT_PREFIX + currentFile.id, JSON.stringify({ content: v, base: originalContent, title: currentFile.title, at: Date.now() }));
        }
        async function restoreDraftIfAny() {
            const id = currentFile.id;
            const d = getDraft(id);
            if (!d) { pendingDraftRestore = null; return; }
            if (d.content === currentFile.content) { clearDraft(id); pendingDraftRestore = null; return; }
            if (pendingDraftRestore === id) { pendingDraftRestore = null; editorTextarea.value = d.content; return; }
            const changed = d.base !== currentFile.content;
            const v = await ask({
                title: '有未保存的草稿',
                message: `${fmtTime(d.at)} 编辑这篇时有修改没保存。` + (changed ? '\n注意：那之后这篇文档又被保存过，恢复草稿会以草稿为准。' : ''),
                buttons: [{ text: '丢弃', value: 'discard', style: 'destructive' }, { text: '恢复草稿', value: 'restore', bold: true }]
            });
            if (currentState !== 'edit' || !currentFile || currentFile.id !== id) return;
            // 按 Esc 关掉也当「恢复」：宁可多留一份，不能悄悄丢
            if (v === 'discard') clearDraft(id);
            else { editorTextarea.value = d.content; }
        }
        function renderDraftBar() {
            draftBarSlot.innerHTML = '';
            if (!currentFile) return;
            const d = getDraft(currentFile.id);
            if (!d || d.content === currentFile.content) return;
            const id = currentFile.id;
            const bar = document.createElement('div'); bar.className = 'draft-bar';
            const text = document.createElement('span'); text.className = 'dt';
            text.textContent = `这篇有 ${fmtTime(d.at)} 未保存的草稿`;
            const go = document.createElement('button'); go.type = 'button'; go.textContent = '继续编辑';
            go.onclick = () => { pendingDraftRestore = id; switchState('edit'); };
            const drop = document.createElement('button'); drop.type = 'button'; drop.className = 'danger'; drop.textContent = '丢弃';
            drop.onclick = async () => { if (await confirmAsk('丢弃这份草稿？', '草稿里的修改会被删掉，文档本身不变。', '丢弃', true)) { clearDraft(id); renderDraftBar(); } };
            bar.append(text, go, drop);
            draftBarSlot.appendChild(bar);
        }
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveDraftNow(); if (currentState === 'read') saveReadPos(); } });
        window.addEventListener('pagehide', () => { saveDraftNow(); if (currentState === 'read') saveReadPos(); });

        // ================= 记住每篇读到哪（不自动跳，点了才跳） =================
        // 用户的要求：每次打开都是首页；「接着上次读」做成按钮——首页有「继续阅读」，
        // 打开读过的文档时底部出现「回到上次读到的位置」，点了才跳。
        // 位置记成「正文第几个顶层块 + 在这块里的比例」，字号变了、图片晚加载也能大致对上；对不上时退回按整篇比例。
        const POS_KEY = 'mdr-read-pos';
        let posSaveEnabled = false, posDirty = false, posEnableTimer = null, posSaveTimer = null;
        function readAllPos() { try { return JSON.parse(lsGet(POS_KEY) || '{}') || {}; } catch (_) { return {}; } }
        function getReadPos(id) { const p = readAllPos()[id]; return p && typeof p.r === 'number' ? p : null; }
        function removeReadPos(id) { const all = readAllPos(); if (all[id]) { delete all[id]; lsSet(POS_KEY, JSON.stringify(all)); } }
        // 程序自己设滚动位置（换文档回到顶部、重新渲染）时不记，免得把上次读到的位置冲成 0
        function disablePosSave() { posSaveEnabled = false; posDirty = false; clearTimeout(posEnableTimer); clearTimeout(posSaveTimer); posSaveTimer = null; }
        function enablePosSaveSoon() { clearTimeout(posEnableTimer); posEnableTimer = setTimeout(() => { posSaveEnabled = true; }, 300); }
        function captureReadPos() {
            const max = vRead.scrollHeight - vRead.clientHeight;
            if (max <= 0) return null;
            const kids = readerContent.children;
            const vTop = vRead.getBoundingClientRect().top;
            let i = -1, f = 0;
            for (let k = 0; k < kids.length; k++) {
                const r = kids[k].getBoundingClientRect();
                if (r.bottom > vTop + 1) { i = k; f = r.height > 0 ? Math.min(1, Math.max(0, (vTop - r.top) / r.height)) : 0; break; }
            }
            return { i, f: +f.toFixed(4), n: kids.length, r: +(vRead.scrollTop / max).toFixed(4), t: Date.now() };
        }
        // 记在「阅读区此刻显示的那篇」（lastReadFileId）名下，不用 currentFile：换文档时 openDoc 先把 currentFile
        // 换成了新的一篇、再离开阅读页，用 currentFile 会把上一篇的位置记到新那篇头上（还会冒出一个假的「回到上次位置」）。
        function saveReadPos() {
            if (currentState !== 'read' || !lastReadFileId || !posDirty) return;
            const pos = captureReadPos();
            if (!pos) return;
            posDirty = false;
            const all = readAllPos();
            all[lastReadFileId] = pos;
            const ids = Object.keys(all);
            if (ids.length > 300) ids.sort((a, b) => all[a].t - all[b].t).slice(0, ids.length - 300).forEach(k => delete all[k]);
            lsSet(POS_KEY, JSON.stringify(all));
        }
        function restoreReadPos(pos) {
            const kids = readerContent.children;
            const max = vRead.scrollHeight - vRead.clientHeight;
            let top;
            const el = pos.n === kids.length && pos.i >= 0 ? kids[pos.i] : null;
            if (el) {
                const r = el.getBoundingClientRect();
                top = vRead.scrollTop + (r.top - vRead.getBoundingClientRect().top) + pos.f * r.height;
            } else top = pos.r * max;
            vRead.scrollTop = Math.max(0, Math.min(max, Math.round(top)));
            posDirty = true;
            posSaveEnabled = true;
            updateTocActive();
        }
        const pctOf = pos => Math.min(100, Math.max(1, Math.round(pos.r * 100)));
        let resumeTimer = null, resumeFor = null;
        function offerResume() {
            const pos = getReadPos(currentFile.id);
            if (!pos || pos.r < 0.02 || vRead.scrollHeight <= vRead.clientHeight) return;
            resumeFor = currentFile.id;
            resumeText.textContent = `回到上次读到的位置 · ${pctOf(pos)}%`;
            resumePill.classList.add('show');
            clearTimeout(resumeTimer);
            resumeTimer = setTimeout(hideResumePill, 8000);
        }
        function hideResumePill() { clearTimeout(resumeTimer); resumePill.classList.remove('show'); }
        document.getElementById('resume-go').onclick = () => {
            hideResumePill();
            if (currentState !== 'read' || !currentFile || currentFile.id !== resumeFor) return;
            const pos = getReadPos(currentFile.id);
            if (pos) restoreReadPos(pos);
        };
        document.getElementById('resume-close').onclick = hideResumePill;

        // 首页「继续阅读」：上次在看的那篇 + 读到百分之几
        function renderHomeContinue() {
            homeContinue.innerHTML = '';
            const id = lsGet('mdr-last-doc');
            const file = id && getDB().files.find(f => f.id === id);
            if (!file) return;
            const pos = getReadPos(id);
            const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'continue-btn';
            const label = document.createElement('span'); label.className = 'cl';
            label.innerHTML = '<i class="fas fa-book-open"></i>';
            label.appendChild(document.createTextNode(' 继续阅读' + (pos && pos.r >= 0.02 ? ` · 读到 ${pctOf(pos)}%` : '')));
            const title = document.createElement('span'); title.className = 'ct'; title.textContent = file.title;
            btn.append(label, title);
            btn.onclick = () => openDoc(id, { jump: true });
            homeContinue.appendChild(btn);
        }

        // ================= 导入文件 =================
        const MD_EXT_RE = /\.(md|markdown|mdown|mkd|mkdn|mdwn|mdx|txt|text)$/i;
        const IMPORT_FAIL = '浏览器本地存储空间已满（或被禁用），文件没有存进来。\n请删掉一些不用的文档后再导入。';
        // 解码：UTF-16（带 BOM）→ UTF-8（严格模式，有一个字节不合法就算失败）→ GBK。
        // Windows 记事本旧版本默认存 GBK，原来固定按 UTF-8 解，打开全是乱码（P3-13）。
        function decodeText(bytes) {
            if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes);
            if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes);
            try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
            catch (_) {
                try { return new TextDecoder('gbk').decode(bytes); }
                catch (__) { return new TextDecoder('utf-8').decode(bytes); }
            }
        }
        // 文本文件里不会出现 0 字节（UTF-16 带 BOM 的除外）；图片、PDF、压缩包开头几 KB 里几乎一定有
        function looksBinary(bytes) {
            if ((bytes[0] === 0xFF && bytes[1] === 0xFE) || (bytes[0] === 0xFE && bytes[1] === 0xFF)) return false;
            const n = Math.min(bytes.length, 8192);
            for (let i = 0; i < n; i++) if (bytes[i] === 0) return true;
            return false;
        }
        function uniqueTitle(base, db) {
            const titles = new Set(db.files.map(f => f.title));
            if (!titles.has(base)) return base;
            let i = 2;
            while (titles.has(`${base} (${i})`)) i++;
            return `${base} (${i})`;
        }

        // 选择框不加 accept 限制：iPhone 上给 accept 写 .md 这类扩展名，有的系统版本会把 .md 文件置灰选不了（不确定，
        // 没法在电脑上验证），所以放开选择、选完再检查：不是文本的拒绝，扩展名不认识的先问一句（P3-3）。
        async function processFileObj(file) {
            if (!file) return;
            const extOk = MD_EXT_RE.test(file.name);
            const binaryType = /^(image|audio|video|font)\//.test(file.type) || /^application\/(pdf|zip|x-zip-compressed|x-rar|x-7z|msword|vnd\.)/.test(file.type);
            if (!extOk && binaryType) { showAlert('不能打开这个文件', `「${file.name}」不是文本文件。\n能打开的是 Markdown（.md）和纯文本（.txt）文件。`); return; }
            if (file.size > 8 * 1024 * 1024) { showAlert('文件太大', `「${file.name}」有 ${(file.size / 1048576).toFixed(1)} MB，浏览器本地存储一共只有 5MB 左右，存不下。`); return; }
            let bytes;
            try { bytes = new Uint8Array(await file.arrayBuffer()); }
            catch (e) { showAlert('读取失败', `「${file.name}」读不出来。`); return; }
            if (looksBinary(bytes)) { showAlert('不能打开这个文件', `「${file.name}」不是文本文件（里面有二进制内容）。\n能打开的是 Markdown（.md）和纯文本（.txt）文件。`); return; }
            const text = decodeText(bytes);
            if (!extOk && !(await confirmAsk('这不是 .md 文件', `「${file.name}」会按纯文本打开，继续吗？`, '打开'))) return;
            // 文件确认能打开了，再问编辑页那边要不要保存（编辑到一半拖了个文件进来 / 点了导入）
            if (!(await confirmLeaveEdit())) return;

            const baseTitle = file.name.replace(/\.[^/.]+$/, "") || file.name;
            const db = getDB();
            const same = db.files.filter(f => f.title === baseTitle);
            if (same.length) {
                // 一模一样的已经在库里：直接打开那篇，不再存第二份
                const identical = same.find(f => f.content === text);
                if (identical) { notify('库里已经有这篇，直接打开'); await openDoc(identical.id, { skipConfirm: true }); return; }
                // 同一个文件导入两次原来会出现两份（O-10）
                const v = await ask({
                    title: '已有同名文档',
                    message: `库里已经有「${baseTitle}」，内容跟这个文件不一样。`,
                    buttons: [
                        { text: '另存一份', value: 'copy', bold: true },
                        { text: '覆盖原文档', value: 'overwrite', style: 'destructive' },
                        { text: '取消', value: 'cancel', style: 'cancel' }
                    ]
                });
                if (v === 'overwrite') {
                    const target = same.slice().sort((a, b) => b.timestamp - a.timestamp)[0];
                    const ok = mutateDB(db => {
                        const f = db.files.find(x => x.id === target.id);
                        if (!f) return false;
                        f.content = text; f.timestamp = Date.now();
                    }, IMPORT_FAIL);
                    if (ok) { clearDraft(target.id); removeReadPos(target.id); if (currentFile && currentFile.id === target.id) lastReadFileId = null; await openDoc(target.id, { skipConfirm: true, force: true }); }
                    return;
                }
                if (v !== 'copy') return;
            }
            // 起名要用此刻最新的库：上面弹框等着用户点的时候，别的标签页可能刚好存了同名的「xx (2)」
            const created = createFile(uniqueTitle(baseTitle, getDB()), text, IMPORT_FAIL);
            if (!created) return;
            await openDoc(created.id, { skipConfirm: true });
        }

        // 原有的 input onchange 触发
        function handleFile(e) {
            const f = e.target.files[0];
            if (e.target) e.target.value = '';
            processFileObj(f);
        }
        document.getElementById('file-upload-home').onchange = handleFile;
        document.getElementById('file-upload-drawer').onchange = handleFile;

        // ================= 新增：全局拖拽文件监听逻辑 =================
        document.addEventListener('dragover', (e) => {
            e.preventDefault(); // 必须阻止默认行为，否则鼠标会显示“禁止拖拽”图标
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault(); // 必须阻止默认行为，否则浏览器会直接离开当前页面去打开文件
            if (dialogOpen) return;
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processFileObj(e.dataTransfer.files[0]);
            }
        });

        // ================= 备份与恢复 =================
        // 文档只存在这个浏览器里：换手机、清缓存都会丢；iPhone Safari 还会在「累计 7 个用 Safari 的日子里没打开过本站」后
        // 清掉本站的 localStorage（WebKit 官方博客 2020《Full Third-Party Cookie Blocking and More》）。
        // 导出成一个 .json 文件自己存好，随时能恢复（审查报告 P1-3 / O-1）。
        document.getElementById('menu-backup').onclick = () => {
            const last = lsGet('mdr-last-export');
            const count = getDB().files.length;
            showActionMenu([
                { text: `共 ${count} 篇 · ` + (last ? `上次导出：${fmtTime(Number(last))}` : '还没导出过'), isTitle: true },
                { text: '导出全部文档（备份文件）', icon: 'fas fa-file-export', action: () => exportAll() },
                { text: '从备份文件恢复', icon: 'fas fa-file-import', action: () => fileRestoreInput.click() },
                { text: '为什么要备份', icon: 'fas fa-circle-info', action: () => showAlert('为什么要备份', '文档只存在这个浏览器里：换手机、清除浏览器数据都会丢。\niPhone 的 Safari 在你连续 7 个使用 Safari 的日子里都没打开过本站时，会自动清空本站数据。\n把本站「添加到主屏幕」再用，可以避开这条自动清理；定期导出一份备份最保险。') }
            ]);
        };
        function exportAll() {
            const db = getDB();
            const payload = { app: 'markdown-reader', format: 1, exportedAt: new Date().toISOString(), db };
            downloadText(`markdown-reader-备份-${dateStamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
            lsSet('mdr-last-export', String(Date.now()));
            notify(`已导出 ${db.files.length} 篇文档`);
        }
        fileRestoreInput.onchange = (e) => {
            const f = e.target.files[0];
            e.target.value = '';
            if (f) restoreFromFile(f);
        };
        // 备份里的一条文档：字段齐全、类型对才收；id 统一成字符串
        function normalizeBackupFile(f, folderIds) {
            if (!f || (typeof f.id !== 'string' && typeof f.id !== 'number') || typeof f.content !== 'string') return null;
            return {
                id: String(f.id), title: typeof f.title === 'string' && f.title ? f.title : '未命名文档', content: f.content,
                timestamp: Number(f.timestamp) || Date.now(), isPinned: !!f.isPinned,
                folderId: folderIds.has(f.folderId) ? f.folderId : 'root'
            };
        }
        async function restoreFromFile(file) {
            let data;
            try { data = JSON.parse(await file.text()); }
            catch (_) { showAlert('不是有效的备份文件', `「${file.name}」读不出来。备份文件是本站「导出全部文档」生成的 .json 文件。`); return; }
            let src = data && data.db ? data.db : data;
            if (Array.isArray(src)) src = { folders: [], files: src };   // 很早的版本只存了一个文件数组
            if (!src || !Array.isArray(src.files)) { showAlert('不是有效的备份文件', `「${file.name}」里没有找到文档列表。`); return; }
            const folders = (Array.isArray(src.folders) ? src.folders : []).filter(f => f && typeof f.id === 'string' && f.id !== 'root' && typeof f.name === 'string')
                .map(f => ({ id: f.id, name: f.name, isOpen: true, isPinned: !!f.isPinned }));
            const cur = getDB();
            const folderIds = new Set(['root', ...folders.map(f => f.id), ...cur.folders.map(f => f.id)]);
            const files = src.files.map(f => normalizeBackupFile(f, folderIds)).filter(Boolean);
            if (!files.length) { showAlert('备份是空的', `「${file.name}」里没有可恢复的文档。`); return; }
            if (!(await confirmLeaveEdit())) return;
            const v = await ask({
                title: '从备份恢复',
                message: `备份里有 ${files.length} 篇文档、${folders.length} 个文件夹。\n「合并」：只添加没有的，备份里更新的那篇会替换掉旧的。\n「替换全部」：先清空现在的 ${cur.files.length} 篇，再换成备份里的。`,
                buttons: [
                    { text: '合并', value: 'merge', bold: true },
                    { text: '替换全部', value: 'replace', style: 'destructive' },
                    { text: '取消', value: 'cancel', style: 'cancel' }
                ]
            });
            if (v !== 'merge' && v !== 'replace') return;
            if (v === 'replace' && !(await confirmAsk('确定替换全部？', `现在的 ${cur.files.length} 篇文档会被删掉，无法撤销。没备份过的话，建议先取消、导出一份。`, '替换', true))) return;
            let added = 0, updated = 0;
            const ok = mutateDB(db => {
                if (v === 'replace') {
                    const root = db.folders.find(f => f.id === 'root') || { id: 'root', name: '默认文件夹', isOpen: true };
                    db.folders = [root, ...folders];
                    db.files = files.map(f => ({ ...f, folderId: f.folderId === 'root' || folders.some(x => x.id === f.folderId) ? f.folderId : 'root' }));
                    added = files.length;
                    return;
                }
                folders.forEach(bf => { if (!db.folders.some(f => f.id === bf.id)) db.folders.push(bf); });
                files.forEach(bf => {
                    const ex = db.files.find(f => f.id === bf.id);
                    if (!ex) { db.files.push(bf); added++; }
                    else if (bf.timestamp > (ex.timestamp || 0) && (bf.content !== ex.content || bf.title !== ex.title)) {
                        ex.title = bf.title; ex.content = bf.content; ex.timestamp = bf.timestamp; updated++;
                    }
                });
            }, '浏览器本地存储空间已满（或被禁用），备份没有恢复进来。\n请删掉一些不用的文档后重试。');
            if (!ok) return;
            closeDrawer();
            notify(v === 'replace' ? `已恢复 ${added} 篇文档` : `新增 ${added} 篇，更新 ${updated} 篇`, 2600);
            // 离开编辑页已经确认过了（上面的 confirmLeaveEdit），恢复完不再停在编辑页
            const still = currentFile && getDB().files.find(f => f.id === currentFile.id);
            if (currentState !== 'home' && !still) { currentFile = null; lastReadFileId = null; switchState('home'); }
            else if (currentState === 'edit') { currentFile = { ...still }; lastReadFileId = null; switchState('read'); }
            else onExternalDBChange(true);
        }

        // ================= 多个标签页 / 姊妹站同时开着 =================
        // 另一个标签页（或数学公式阅读器）改了文档库时，浏览器会给这边发 storage 事件：
        // 刷新侧边栏和当前文档的信息。编辑中的内容不动，保存时 commitEdit 会发现冲突并让你选。
        window.addEventListener('storage', (e) => {
            if (e.storageArea && e.storageArea !== localStorage) return;
            if (e.key === DB_KEY || e.key === null) onExternalDBChange(false);
        });
        function onExternalDBChange(fromRestore) {
            if (!folderDragging) renderDrawer();
            if (currentState === 'home') { renderHomeContinue(); return; }
            if (!currentFile) return;
            const f = getDB().files.find(x => x.id === currentFile.id);
            if (!f) {
                if (currentState === 'read') { notify('这篇文档已在另一个页面被删除', 2600); }
                return; // 编辑中：保存时会按原 id 存回去
            }
            if (f.title !== currentFile.title) {
                currentFile.title = f.title;
                headerUI.headerTitle.textContent = currentState === 'edit' ? "编辑: " + f.title : f.title;
            }
            if (currentState === 'read' && f.content !== currentFile.content) {
                currentFile = { ...f };
                const top = vRead.scrollTop;
                disablePosSave();
                renderMarkdown(f.content, readerContent).then(ok => {
                    if (!ok || currentState !== 'read') return;
                    generateTOC(); vRead.scrollTop = top; updateTocActive(); renderDraftBar(); enablePosSaveSoon();
                });
                if (!fromRestore) notify('已同步另一个页面的修改');
            } else if (currentState === 'read') {
                currentFile = { ...f };
            }
        }

        // ================= Markdown 渲染及其他逻辑 =================
        // 每个目标容器一个渲染序号。renderMarkdown 里有 await（按需加载语言包、Mermaid），
        // 连续打字时前一次可能还没跑完下一次就开始了；没有这个序号的话，先开始、后结束的那次
        // 会把旧内容盖回预览上（典型场景：刚敲出 ```kotlin 触发下载语言包，下一个字符的渲染
        // 先完成，语言包到了之后上一次的渲染再把旧文本写回去）。
        const renderSeqs = new WeakMap();
        let lastRenderCost = 0; // 上一次编辑预览「解析 + 写进页面」花了多少毫秒，决定下一次要不要等打字停顿

        // 返回 false 表示这次渲染已经被更新的一次取代、中途放弃了
        async function renderMarkdown(text, target) {
            const seq = (renderSeqs.get(target) || 0) + 1;
            renderSeqs.set(target, seq);
            const stale = () => renderSeqs.get(target) !== seq;
            const body = stripFrontMatter(text);
            await ensureCodeLanguagesLoaded(body);
            if (stale()) return false;

            // 安全约束（不能改）：产出 HTML 的永远是完整的 marked.parse()——marked.use() 注册的
            // postprocess 钩子（DOMPurify.sanitize，防止 .md 文件里夹带的 <script>/onerror 被执行）
            // 只在这条完整流水线上生效。marked.lexer()+marked.parser([token]) 逐块渲染不会触发
            // 这个钩子（实测过：同一段带 onerror 的内容，marked.parse() 正确剥离，逐块渲染原样漏过去）。
            //
            // 编辑预览要做光标同步，需要知道每一块对应源码第几行：打开 markBlocks，让
            // processAllTokens 钩子在每个顶层块前插一个空的行号标记（见上面 annotateBlocks 的说明）。
            // 标记也在 marked.parse 里生成、同样经过 DOMPurify，不引入任何未净化的 HTML。
            const isPreview = target === editorPreview;
            const t0 = performance.now();
            markBlocks = isPreview;
            markBlocksOut = [];
            let html;
            try { html = marked.parse(body); } finally { markBlocks = false; }
            const blocks = markBlocksOut;
            target.innerHTML = html;

            // 2026-08-02 用户实测反馈"左边点光标右边定位非常不精准"：只给顶层块打标粒度太粗，
            // 一个章节的十几道题是一个列表、也就是一个块。所以列表项、嵌套列表项、表格行各自
            // 再打上起始行号，粒度细到"源码一行"。只读 token 的 raw 算行号，不生成任何 HTML。
            if (isPreview) tagBlockDetails(target, blocks, markSrc);

            // 标题锚点：使用 GitHub 风格 slug，支持文档内 [文字](#标题) 跳转。
            // 脚注区自带的「脚注」标题已经有 id（脚注链接靠它），不动。
            const usedSlugs = new Set();
            target.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
                if (heading.closest('.footnotes')) return;
                heading.id = slugify(heading.textContent, usedSlugs);
            });

            // 外部链接在新标签页打开，不把阅读器整个换掉（P3-1）。DOMPurify 默认会删掉 target 属性，
            // 所以在净化之后、在 DOM 上加；rel=noopener 让新页面拿不到这一页。
            target.querySelectorAll('a[href]').forEach((a) => {
                const href = a.getAttribute('href');
                if (!/^https?:\/\//i.test(href)) return;
                try { if (new URL(href).origin === location.origin) return; } catch (_) { return; }
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            });

            // 代码块复制按钮：用外层 wrapper 承载按钮，避免 pre 横向滚动时按钮跟着移动
            target.querySelectorAll('pre code').forEach((block) => {
                const pre = block.parentNode;
                if (pre.parentNode.classList.contains('code-block-wrapper')) return;
                const copyBtn = document.createElement('button'); copyBtn.className = 'copy-code-btn'; copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
                copyBtn.setAttribute('aria-label', '复制代码');

                copyBtn.onclick = () => { navigator.clipboard.writeText(block.textContent).then(() => { copyBtn.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i>', 2000); }); };
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);

                // 行号：超过3行的代码块才加，且不对将被转成图表的 mermaid 代码块加（Mermaid 图表本身就不需要行号）
                const isMermaid = block.classList.contains('language-mermaid');
                const lines = block.textContent.replace(/\n$/, '').split('\n');
                if (!isMermaid && lines.length > 3) {
                    const gutter = document.createElement('div');
                    gutter.className = 'line-numbers-rows';
                    gutter.innerHTML = lines.map((_, i) => `<span>${i + 1}</span>`).join('');
                    wrapper.classList.add('with-line-numbers');
                    wrapper.appendChild(gutter);
                }

                wrapper.appendChild(pre);
                wrapper.appendChild(copyBtn);
            });
            if (isPreview) lastRenderCost = performance.now() - t0;

            // Mermaid 图表：将 ```mermaid 代码块转换为图表，复制按钮一并迁移到图表容器上
            const mermaidBlocks = target.querySelectorAll('pre code.language-mermaid');
            if (mermaidBlocks.length > 0) {
                mermaidBlocks.forEach((block) => {
                    const pre = block.parentNode;
                    const codeWrapper = pre.parentNode;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'mermaid-wrapper';
                    const graph = document.createElement('div');
                    graph.className = 'mermaid';
                    graph.textContent = block.textContent;
                    // 记下源码：切换深色/浅色时要按新主题重画（见 setTheme）
                    graph.dataset.source = block.textContent;

                    wrapper.appendChild(graph);
                    const copyBtn = codeWrapper.querySelector('.copy-code-btn');
                    if (copyBtn) wrapper.appendChild(copyBtn);
                    codeWrapper.replaceWith(wrapper);
                });
                if (!stale()) await runMermaid(Array.from(target.querySelectorAll('.mermaid[data-source]')), stale);
            }
            return !stale();
        }

        // 一张一张画，某一张写错了只在它的位置显示提示，不影响别的图和后面的目录。
        // 原来整批 await mermaid.run 出错没接住：异常冒出去，阅读页的目录停在上一篇（P2-1）。
        async function runMermaid(nodes, isStale) {
            mermaid.initialize({ startOnLoad: false, theme: document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'default' });
            for (const node of nodes) {
                if (isStale && isStale()) return;
                try { await mermaid.run({ nodes: [node] }); }
                catch (err) { showMermaidError(node, err); }
            }
        }
        function showMermaidError(node, err) {
            node.removeAttribute('data-processed');
            node.textContent = '';
            const box = document.createElement('div'); box.className = 'mermaid-error';
            const msg = String((err && (err.message || err.str)) || err || '').split('\n').filter(Boolean)[0] || '';
            box.textContent = '图表语法有误' + (msg ? '：' + msg.slice(0, 160) : '');
            const pre = document.createElement('pre'); pre.textContent = node.dataset.source || '';
            box.appendChild(pre);
            node.appendChild(box);
            // Mermaid 出错时会在 body 末尾留下一个画着「Syntax error」的临时元素，清掉
            document.querySelectorAll('body > [id^="dmermaid"], body > [id^="mermaid-"]').forEach(el => el.remove());
        }

        // 一个行号标记管辖的元素：从它后面一个开始，到下一个标记为止
        function blockElements(mark) {
            const els = [];
            for (let el = mark.nextElementSibling; el && !el.classList.contains('kb-block-mark'); el = el.nextElementSibling) els.push(el);
            return els;
        }

        function tagBlockDetails(target, blocks, src) {
            // 按 raw 在源码里的出现位置定位每个列表项。cursor 是"从哪里开始往后找"的游标，
            // 必须严格随文档顺序推进——否则内容完全相同的两行（判断题这种高度重复的文档里
            // 很常见）会被一起匹配到最前面那一处，行号全部算错。
            function tagList(items, listEl, listOffset) {
                let cursor = listOffset;
                items.forEach((item, j) => {
                    const raw = item.raw || '';
                    let idx = raw ? src.indexOf(raw, cursor) : cursor;
                    if (idx === -1) idx = cursor;
                    const li = listEl.children[j];
                    if (li && li.tagName === 'LI') {
                        li.dataset.startLine = (src.slice(0, idx).match(/\n/g) || []).length;
                        // 嵌套列表：item.tokens 里 type==='list' 的那些，按顺序对应这个 li 底下的 ul/ol
                        const nestedEls = Array.from(li.children).filter(c => c.tagName === 'UL' || c.tagName === 'OL');
                        (item.tokens || []).filter(t => t.type === 'list').forEach((nt, k) => {
                            if (nestedEls[k] && Array.isArray(nt.items)) tagList(nt.items, nestedEls[k], idx);
                        });
                    }
                    cursor = idx + raw.length;
                });
            }
            // GFM 表格的源码结构是固定的：第1行表头、第2行分隔线、之后每行一条数据行，
            // 行号直接按顺序推算（单元格内容重复率高，去源码里搜反而容易匹配错位置）
            function tagTable(tableEl, startLine) {
                const headRow = tableEl.querySelector('thead tr');
                if (headRow) headRow.dataset.startLine = startLine;
                tableEl.querySelectorAll('tbody tr').forEach((tr, i) => { tr.dataset.startLine = startLine + 2 + i; });
            }
            target.querySelectorAll('.kb-block-mark').forEach((mark) => {
                const block = blocks[Number(mark.dataset.block)];
                const first = block && blockElements(mark)[0];
                if (!first) return;
                if (block.type === 'list' && /^(UL|OL)$/.test(first.tagName) && Array.isArray(block.token.items)) tagList(block.token.items, first, block.offset);
                else if (block.type === 'table' && first.tagName === 'TABLE') tagTable(first, block.startLine);
            });
        }

        // 源码第 line 行 → 预览里的定位点（整块、列表项或表格行）。
        // querySelectorAll 返回文档顺序，文档顺序下起始行号单调不减（标记在它那块内容前面、
        // 父列表项 <= 子项），所以"取最后一个 <= 光标行"可以遇到更大的就 break。
        // 渲染不出任何元素的块（链接定义、HTML 注释、脚注定义）没有位置可去，跳过，落到前一个点上。
        function locatePreviewLine(container, line) {
            let hit = null;
            for (const point of container.querySelectorAll('[data-start-line]')) {
                if (Number(point.dataset.startLine) > line) break;
                if (point.classList.contains('kb-block-mark') && !blockElements(point).length) continue;
                hit = point;
            }
            if (!hit) hit = Array.from(container.querySelectorAll('.kb-block-mark')).find(m => blockElements(m).length) || null;
            if (!hit) return null;
            let flash, top, height;
            if (hit.classList.contains('kb-block-mark')) {
                flash = blockElements(hit);
                const first = flash[0].getBoundingClientRect(), last = flash[flash.length - 1].getBoundingClientRect();
                top = first.top; height = Math.max(0, last.bottom - first.top);
            } else {
                flash = [hit];
                const r = hit.getBoundingClientRect();
                top = r.top; height = r.height;
            }
            return { top, height, startLine: Number(hit.dataset.startLine), endLine: Number(hit.dataset.endLine), flash };
        }

        // ================= 目录 =================
        let tocLinks = [];
        let hasToc = false;
        // 电脑上目录栏可以收起（记住选择）；文档没有标题时自动收起，阅读区更宽
        let tocHiddenPref = lsGet('mdr-toc-hidden') === '1';

        function generateTOC() {
            tocContent.innerHTML = '';
            tocLinks = [];
            // 脚注区自带一个读屏用的「脚注」标题（视觉上藏起来了），不进目录
            const headings = Array.from(readerContent.querySelectorAll('h1, h2, h3, h4')).filter(h => !h.closest('.footnotes'));
            hasToc = headings.length > 0;
            if (!hasToc) tocContent.innerHTML = '<div class="toc-empty">暂无目录</div>';
            headings.forEach(h => {
                const link = document.createElement('a'); link.href = `#${h.id}`; link.className = `toc-link toc-${h.tagName.toLowerCase()}`; link.textContent = h.textContent;
                link.onclick = (e) => { e.preventDefault(); scrollToInPane(h, vRead); if (isMobileWidth()) closeTocMobile(); };
                tocContent.appendChild(link);
                tocLinks.push({ h, link });
            });
            updateTocLayout();
        }

        function updateTocLayout() {
            if (currentState !== 'read') return;
            if (isMobileWidth()) {
                tocSidebar.classList.add('collapsed');
                btnFabToc.classList.toggle('hidden', !hasToc);
            } else {
                tocSidebar.classList.toggle('collapsed', !hasToc || tocHiddenPref);
                headerUI.btnTocToggle.classList.toggle('hidden', !hasToc);
                headerUI.btnTocToggle.classList.toggle('active', hasToc && !tocHiddenPref);
                headerUI.btnTocToggle.title = tocHiddenPref ? '展开目录' : '收起目录';
            }
        }
        headerUI.btnTocToggle.onclick = () => {
            tocHiddenPref = !tocHiddenPref;
            lsSet('mdr-toc-hidden', tocHiddenPref ? '1' : '0');
            updateTocLayout();
        };

        // 高亮「当前读到的这一节」：视口顶部往下 80px 以内最后一个标题；滚到底时取最后一个露出来的
        let activeTocLink = null;
        function updateTocActive() {
            if (currentState !== 'read' || !tocLinks.length) return;
            const vr = vRead.getBoundingClientRect();
            const atBottom = vRead.scrollTop + vRead.clientHeight >= vRead.scrollHeight - 2;
            let cur = null;
            for (const t of tocLinks) {
                const top = t.h.getBoundingClientRect().top;
                if (top <= vr.top + 80 || (atBottom && top < vr.bottom)) cur = t; else break;
            }
            const link = cur ? cur.link : null;
            if (link === activeTocLink) return;
            if (activeTocLink) activeTocLink.classList.remove('active');
            activeTocLink = link;
            if (!link) return;
            link.classList.add('active');
            // 高亮的那条滚出目录栏可视范围时，把它带回来（只滚目录栏自己）
            const sr = tocSidebar.getBoundingClientRect(), lr = link.getBoundingClientRect();
            if (sr.height > 0 && (lr.top < sr.top + 40 || lr.bottom > sr.bottom - 40)) tocSidebar.scrollTop += lr.top - sr.top - sr.height / 3;
        }

        let tocRaf = 0;
        vRead.addEventListener('scroll', () => {
            if (currentState !== 'read') return;
            if (!tocRaf) tocRaf = requestAnimationFrame(() => { tocRaf = 0; updateTocActive(); });
            if (!posSaveEnabled) return;
            posDirty = true;
            if (!posSaveTimer) posSaveTimer = setTimeout(() => { posSaveTimer = null; saveReadPos(); }, 400);
        }, { passive: true });

        // 把 el 滚到 pane 顶部（留一点间距）。只滚 pane 自己——scrollIntoView 会连带滚动所有能滚的祖先。
        function scrollToInPane(el, pane, smooth = true) {
            const top = pane.scrollTop + el.getBoundingClientRect().top - pane.getBoundingClientRect().top - 12;
            pane.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
        }

        // 页内链接 [文字](#标题) 和脚注：在「自己这个容器」里找目标再滚动。
        // 阅读区和编辑预览里有同名 id，原来交给浏览器跳，它跳到隐藏着的那一份上，编辑预览里点了不动（P3-5）。
        function handleHashLink(e, container, pane) {
            const a = e.target.closest && e.target.closest('a[href^="#"]');
            if (!a || !container.contains(a)) return;
            let id = a.getAttribute('href').slice(1);
            try { id = decodeURIComponent(id); } catch (_) {}
            if (!id) return;
            const t = container.querySelector(`[id="${CSS.escape(id)}"]`);
            if (!t) return;
            e.preventDefault();
            scrollToInPane(t, pane);
        }
        readerContent.addEventListener('click', e => handleHashLink(e, readerContent, vRead));
        editorPreview.addEventListener('click', e => handleHashLink(e, editorPreview, previewPane));

        function flashHighlight(els) {
            editorPreview.querySelectorAll('.sync-highlight').forEach(n => n.classList.remove('sync-highlight'));
            if (!els || !els.length) return;
            void els[0].offsetWidth; // force reflow so re-adding the class restarts the animation
            els.forEach(el => el.classList.add('sync-highlight'));
            setTimeout(() => els.forEach(el => el.classList.remove('sync-highlight')), 900);
        }

        function scrollPreviewToCursor() {
            if (!previewVisible()) return;
            const value = editorTextarea.value;
            // 预览渲染的是去掉 YAML front matter 之后的正文（stripFrontMatter），行号是按正文算的；
            // 光标行号却是按整个编辑框算的。原来没扣掉这一段，带 front matter 的文档光标同步
            // 会整体错开 front matter 那么多行（2026-10-06 发现）。
            const fmLength = value.length - stripFrontMatter(value).length;
            const fmLines = (value.slice(0, fmLength).match(/\n/g) || []).length;
            const cursorLine = (value.slice(0, editorTextarea.selectionStart).match(/\n/g) || []).length - fmLines;
            const hit = locatePreviewLine(editorPreview, cursorLine);
            if (!hit) return;
            // 顶部对齐（不是 scrollIntoView center）：用户明确反馈"光标那一行在右边应该定位到最上面"，
            // 参照的是 MyKnowledgeBase 里同名功能（目标顶边对齐容器顶边、留一点呼吸间距）。
            // 直接算 .preview-pane（真正带 overflow-y:auto 的那一层）该滚多少，不连带滚动页面本身。
            const TOP_GAP = 12; // 跟 MyKnowledgeBase 的 scrollPreviewToCursor 保持同一个数值
            const pane = previewPane;
            if (!pane) return;
            const paneRect = pane.getBoundingClientRect();
            // 目标比可视区还高时（长代码块、超长段落这种块内部没有更细元素可选的情况），
            // 按"光标在这块的第几行"在块内部按比例插值，把光标那一行本身顶到最上面。
            let anchorTop = hit.top;
            if (hit.height >= paneRect.height) {
                const span = Number.isFinite(hit.endLine) && hit.endLine > hit.startLine ? hit.endLine - hit.startLine : 0;
                const ratio = span > 0 ? Math.min(1, Math.max(0, (cursorLine - hit.startLine) / span)) : 0;
                anchorTop = hit.top + ratio * hit.height;
            }
            pane.scrollTop += anchorTop - paneRect.top - TOP_GAP;
            flashHighlight(hit.flash);
        }

        // ================= 编辑预览：等打字停顿再渲染 + 手机上的编辑/预览标签 =================
        // 原来每敲一个字整篇重新渲染：1950 行的文档电脑上每次按键约 137 毫秒，手机上更慢、打字跟不上（P2-6）。
        // 现在：上一次渲染很快（< 30ms，小文档）就照旧立刻渲染；慢的话等打字停顿 150ms 再渲染一次。
        // Mermaid 图也跟着只在停下来时重画。手机上在「编辑」标签时预览看不见，干脆不渲染，切到「预览」时再渲染。
        let editTab = 'edit', previewDirty = false, previewTimer = null;
        function previewVisible() { return currentState === 'edit' && (!isMobileWidth() || editTab === 'preview'); }
        function schedulePreview(immediate) {
            previewDirty = true;
            clearTimeout(previewTimer);
            if (!previewVisible()) return;
            previewTimer = setTimeout(flushPreview, immediate || lastRenderCost < 30 ? 0 : 150);
        }
        async function flushPreview() {
            clearTimeout(previewTimer);
            if (!previewDirty) return;
            previewDirty = false;
            // 只有没被后来的渲染取代的那一次才去定位，免得旧的那次跑完把预览滚回旧位置
            if (await renderMarkdown(editorTextarea.value, editorPreview)) scrollPreviewToCursor();
        }
        function setEditTab(tab, sync = true) {
            editTab = tab;
            vEdit.classList.toggle('tab-edit', tab === 'edit');
            vEdit.classList.toggle('tab-preview', tab === 'preview');
            tabEditBtn.classList.toggle('on', tab === 'edit'); tabEditBtn.setAttribute('aria-selected', tab === 'edit');
            tabPreviewBtn.classList.toggle('on', tab === 'preview'); tabPreviewBtn.setAttribute('aria-selected', tab === 'preview');
            if (!sync) return;
            // 切到预览：有没渲染的改动先渲染，然后定位到光标所在的那一块
            if (tab === 'preview') { if (previewDirty) flushPreview(); else scrollPreviewToCursor(); }
        }
        tabEditBtn.onclick = () => setEditTab('edit');
        tabPreviewBtn.onclick = () => setEditTab('preview');

        const CURSOR_MOVE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown']);
        editorTextarea.addEventListener('click', scrollPreviewToCursor);
        editorTextarea.addEventListener('keyup', e => { if (CURSOR_MOVE_KEYS.has(e.key)) scrollPreviewToCursor(); });
        editorTextarea.addEventListener('input', () => { scheduleDraftSave(); schedulePreview(false); });

        // ================= 快捷键 =================
        // 编辑框里 Tab 缩进 / Shift+Tab 取消缩进（写嵌套列表要用；4 个空格，无序、有序列表都能嵌套）。
        // 用 execCommand('insertText') 插入：走浏览器自己的输入流程，Ctrl+Z 能撤销；不支持时退回 setRangeText。
        const INDENT = '    ';
        function insertAtSelection(text) {
            editorTextarea.focus();
            let ok = false;
            try { ok = document.execCommand('insertText', false, text); } catch (_) { ok = false; }
            if (!ok) {
                editorTextarea.setRangeText(text, editorTextarea.selectionStart, editorTextarea.selectionEnd, 'end');
                editorTextarea.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }
        editorTextarea.addEventListener('keydown', (e) => {
            if (e.key !== 'Tab' || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
            e.preventDefault();
            const ta = editorTextarea, v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
            if (s === en && !e.shiftKey) { insertAtSelection(INDENT); return; }
            // 选中了多行（或 Shift+Tab）：对涉及到的每一行整体缩进 / 取消缩进
            const lineStart = v.lastIndexOf('\n', s - 1) + 1;
            const endAdj = en > s && v[en - 1] === '\n' ? en - 1 : en;
            const lineEndIdx = v.indexOf('\n', endAdj);
            const lineEnd = lineEndIdx === -1 ? v.length : lineEndIdx;
            const lines = v.slice(lineStart, lineEnd).split('\n');
            const out = e.shiftKey ? lines.map(l => l.replace(/^( {1,4}|\t)/, '')) : lines.map(l => INDENT + l);
            const block = out.join('\n');
            if (block === v.slice(lineStart, lineEnd)) return;
            ta.setSelectionRange(lineStart, lineEnd);
            insertAtSelection(block);
            ta.setSelectionRange(lineStart, lineStart + block.length);
        });

        // Ctrl/⌘+S 保存（原来会弹出浏览器的「网页另存为」）；Esc 关掉最上面的那一层（侧边栏、菜单、目录、提示）
        document.addEventListener('keydown', (e) => {
            if (dialogOpen) return; // 弹框自己处理按键
            if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 's' || e.key === 'S')) {
                if (currentState === 'edit') { e.preventDefault(); saveEdit(); }
                return;
            }
            if (e.key !== 'Escape') return;
            if (actionMenu.classList.contains('show')) { e.preventDefault(); closeActionMenu(); return; }
            if (tocSidebar.classList.contains('mobile-open')) { e.preventDefault(); closeTocMobile(); return; }
            if (drawerOpen) {
                e.preventDefault();
                if (document.activeElement === searchInput && searchInput.value) { searchClear.onclick(); return; }
                closeDrawer(); return;
            }
            if (titleTooltip.classList.contains('show')) { titleTooltip.classList.remove('show'); return; }
            if (resumePill.classList.contains('show')) { hideResumePill(); return; }
        });

        // ================= 新建文档 / 示例 =================
        document.getElementById('menu-new').onclick = async () => {
            if (!(await confirmLeaveEdit())) return;
            const title = await promptAsk('新建文档', '未命名文档', '创建', '文档名称');
            if (!title) return;
            const file = createFile(title, `# ${title}\n\n`, '浏览器本地存储空间已满（或被禁用），新文档没有建起来。\n请删掉一些不用的文档后重试。');
            if (!file) return;
            currentFile = { ...file }; closeDrawer(); switchState('edit');
        };

        // 示例文档固定 id。已经有了就直接打开（原来每次都用默认内容覆盖，你改过的示例会被悄悄改回去，P3-14）；
        // 只有还是最早那版两行字的旧示例时，才换成现在这篇功能展示。
        const SAMPLE_ID = 'sample';
        const OLD_SAMPLE_CONTENT = '# 文件管理升级\n\n现在你可以点击左侧菜单栏顶部的**排序按钮**，自由切换按最新或最旧时间排序文件了！';
        const SAMPLE_TITLE = '示例：功能展示';
        const SAMPLE_CONTENT = [
            '# 示例：功能展示',
            '',
            '这篇示例展示阅读器能显示哪些内容。它就存在你的文档库里，可以随便改；改过之后再点「示例」，打开的还是你改过的这一篇。',
            '',
            '## 文字与列表',
            '',
            '**加粗**、*斜体*、~~删除线~~、`行内代码`，还有链接：[Markdown 指南](https://www.markdownguide.org/)（外部链接会在新标签页打开）。',
            '',
            '- 无序列表',
            '    - 嵌套一层（编辑时按 Tab 缩进）',
            '- [x] 已完成的任务',
            '- [ ] 未完成的任务',
            '',
            '1. 有序列表',
            '2. 第二项',
            '',
            '> 普通引用块',
            '',
            '> [!TIP]',
            '> 提示框：还有 NOTE / IMPORTANT / WARNING / CAUTION 四种。',
            '',
            '## 公式',
            '',
            '行内公式：质能方程$E = mc^2$，中文紧贴着写也能识别。',
            '',
            '行间公式：',
            '',
            '$$',
            '\\int_0^1 x^2 \\, dx = \\frac{1}{3}',
            '$$',
            '',
            '## 表格',
            '',
            '| 功能 | 在哪里 |',
            '|---|---|',
            '| 目录 | 电脑在左侧；手机点右下角的按钮 |',
            '| 字号 | 右上角 A- / A+（手机在「…」菜单里） |',
            '| 备份 | 左上角菜单 →「备份与恢复」 |',
            '',
            '## 代码',
            '',
            '```js',
            'function greet(name) {',
            '    // 代码块右上角可以一键复制',
            '    return `你好，${name}`;',
            '}',
            'console.log(greet(\'世界\'));',
            '```',
            '',
            '## 图表（Mermaid）',
            '',
            '```mermaid',
            'flowchart LR',
            '    A[打开 .md 文件] --> B{要改吗}',
            '    B -- 要 --> C[编辑并保存]',
            '    B -- 不要 --> D[直接阅读]',
            '```',
            '',
            '## 脚注',
            '',
            '这句话后面有一个脚注[^1]，点它可以跳到文末。',
            '',
            '[^1]: 这里是脚注的内容，点右边的箭头回到原处。',
            ''
        ].join('\n');
        headerUI.btnHomeSample.onclick = async () => {
            const existing = getDB().files.find(f => f.id === SAMPLE_ID);
            if (!existing || existing.content === OLD_SAMPLE_CONTENT) {
                const ok = mutateDB(db => {
                    const ex = db.files.find(f => f.id === SAMPLE_ID);
                    if (ex) { ex.title = SAMPLE_TITLE; ex.content = SAMPLE_CONTENT; ex.timestamp = Date.now(); }
                    else db.files.unshift({ id: SAMPLE_ID, title: SAMPLE_TITLE, content: SAMPLE_CONTENT, timestamp: Date.now(), isPinned: false, folderId: 'root' });
                }, '浏览器本地存储空间已满（或被禁用），示例文档没有存进来。');
                if (!ok) return;
            }
            await openDoc(SAMPLE_ID);
        };

        // ================= 深浅色 =================
        // 没手动选过时跟着系统变（晚上系统切深色，页面也跟着变）；在这里手动点过就按你点的来。
        // 手动选回「跟系统当前一样」的那一种，就当作恢复跟随系统。
        // 选择记在本站自己的 mdr-theme-choice；md-theme 是跟数学公式阅读器共用的老键，那边每次打开都会写，
        // 分不清是不是手动选的，所以只在第一次升级时用它推断一次：跟系统不一样，说明当初是手动选的。
        const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
        if (lsGet('mdr-theme-migrated') !== '1') {
            const legacy = lsGet('md-theme');
            if ((legacy === 'dark' || legacy === 'light') && (legacy === 'dark') !== darkMQ.matches) lsSet('mdr-theme-choice', legacy);
            lsSet('mdr-theme-migrated', '1');
        }
        function toggleTheme() {
            const toDark = document.body.getAttribute('data-theme') !== 'dark';
            if (toDark === darkMQ.matches) lsRemove('mdr-theme-choice');
            else lsSet('mdr-theme-choice', toDark ? 'dark' : 'light');
            lsSet('md-theme', toDark ? 'dark' : 'light');
            setTheme(toDark);
        }
        headerUI.btnTheme.onclick = toggleTheme;
        const onSystemTheme = (e) => { if (!lsGet('mdr-theme-choice')) setTheme(e.matches); };
        if (darkMQ.addEventListener) darkMQ.addEventListener('change', onSystemTheme); else if (darkMQ.addListener) darkMQ.addListener(onSystemTheme);

        // 原来是 window.onresize = () => switchState(currentState)：每次窗口尺寸变化都整个重走一遍
        // 状态切换——编辑状态下会把编辑框重置成 currentFile.content，**没保存的修改全部丢失**
        // （2026-10-06 实测：手机转屏、电脑拖窗口大小、软键盘把视口挤小都会触发）；阅读状态下也是
        // 每一帧都把整篇重新渲染一遍。真正需要随宽度变的只有顶栏按钮和目录栏，而且只在跨过 768
        // 断点的那一下才变，所以只在跨断点时刷新外壳，不碰内容。
        let lastIsMobile = isMobileWidth();
        window.addEventListener('resize', () => {
            const isMobile = isMobileWidth();
            if (isMobile === lastIsMobile) return;
            lastIsMobile = isMobile;
            if (!isMobile) closeTocMobile();
            applyChrome(currentState);
            // 从手机宽度变成电脑宽度：预览露出来了，有没渲染的改动就补上
            if (currentState === 'edit' && previewDirty && previewVisible()) schedulePreview(true);
        });

        // ================= 阅读区字号缩放（0.8~1.4，步进0.1，存到 localStorage） =================
        let mdFontScale = parseFloat(lsGet('md-font-scale')) || 1;
        function applyFontScale() { document.documentElement.style.setProperty('--md-font-scale', mdFontScale); }
        function changeFontScale(delta) {
            mdFontScale = Math.min(1.4, Math.max(0.8, +(mdFontScale + delta).toFixed(2)));
            lsSet('md-font-scale', mdFontScale);
            applyFontScale();
        }
        function resetFontScale() { mdFontScale = 1; lsSet('md-font-scale', 1); applyFontScale(); }
        headerUI.btnFontDec.onclick = () => changeFontScale(-0.1);
        headerUI.btnFontInc.onclick = () => changeFontScale(0.1);
        headerUI.btnFontReset.onclick = resetFontScale;
        applyFontScale();

        // ================= 代码行号显示开关（默认关闭，存到 localStorage） =================
        let showLineNumbers = lsGet('md-line-numbers') === 'on';
        function applyLineNumberPref() {
            document.body.classList.toggle('show-line-numbers', showLineNumbers);
            headerUI.btnLinenumToggle.classList.toggle('active', showLineNumbers);
            headerUI.btnLinenumToggle.title = showLineNumbers ? '隐藏代码行号' : '显示代码行号';
        }
        function toggleLineNumbers() {
            showLineNumbers = !showLineNumbers;
            lsSet('md-line-numbers', showLineNumbers ? 'on' : 'off');
            applyLineNumberPref();
        }
        headerUI.btnLinenumToggle.onclick = toggleLineNumbers;
        applyLineNumberPref();

        function setTheme(isDark) {
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            headerUI.btnTheme.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            mdStyleLink.href = `https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-${isDark ? 'dark' : 'light'}.min.css`;
            hljsStyleLink.href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${isDark ? 'github-dark' : 'github'}.min.css`;
            rerenderMermaid();
        }
        // 切换深色/浅色后，已经画好的 Mermaid 图要按新主题重画，不然深色背景上留着一张浅色主题的图。
        // renderMarkdown 画图时把源码记在了 data-source 上。只找阅读区和编辑预览里的（不用 document 全局找）。
        function rerenderMermaid() {
            const graphs = [readerContent, editorPreview].flatMap(c => Array.from(c.querySelectorAll('.mermaid[data-source]')));
            if (!graphs.length) return;
            graphs.forEach(g => { g.removeAttribute('data-processed'); g.textContent = g.dataset.source; });
            runMermaid(graphs).catch(err => console.error('Mermaid 重画失败:', err));
        }
        const themeChoice = lsGet('mdr-theme-choice');
        setTheme(themeChoice ? themeChoice === 'dark' : darkMQ.matches);

        // 打开页面先读一次库：数据损坏要在一打开时就提示、先把原文另存起来（侧边栏关着时不画，不会替我们读）
        getDB();
        switchState('home');
    </script>
</body>
</html>
