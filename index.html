<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Markdown Reader</title>
    
    <!-- 版本全部钉死（2026-10-06）：原来 marked / marked-highlight / marked-katex-extension 三个地址都没写版本号。
         marked 从 v16 起不再提供 marked.min.js，CDN 是「回退到最后一个还有这个文件的版本」才给出 v15.0.12 的，
         属于凑巧能用；哪天扩展发了只支持新版 marked 的版本，页面会无声无息地坏掉。
         这里钉的就是当时实际在跑的版本，行为不变。升级要整组一起升、一起测。
         2026-10-09 按已公开漏洞升了三个（审查报告 P1-0 / P2-0）：
         mermaid 10.9.3 → 10.9.8（CVE-2025-54881 时序图标签 + $$ 能执行代码，另有样式注入、卡死共 8 条，10.9.8 全部修完）；
         katex 0.16.9 → 0.16.22（maxExpand 绕过能卡死页面，JS 和 CSS 两处版本号必须一致）；
         dompurify 3.4.10 → 3.4.16（命中的几条都要用到本站没用的功能，顺手升）。
         钉版本的另一面：要定期去 GitHub Advisory Database 查一下这几个版本有没有新公开的漏洞。 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.2.2/lib/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <!-- 脚注 [^1] 和 GitHub 提示框 > [!NOTE]（2026-10-06 加，跟 MyKnowledgeBase 同一对扩展、同一版本） -->
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.4.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-alert@2.1.2/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <link id="hljs-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link id="md-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">
    
    <style>
    
        /* ================= 1. Apple 风格色彩与底层锁死 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --apple-blue: #007AFF; --apple-green: #34C759; --apple-red: #FF3B30; --apple-gray: #8E8E93;
            --bg-base: #F2F2F7; --bg-surface: #FFFFFF; --text-main: #000000; --text-secondary: #6C6C70;
            --border-color: #E5E5EA; --header-bg: rgba(255, 255, 255, 0.85); --sidebar-bg: #F8F8F8;
            --header-height: 55px;
            /* 阅读区字号缩放，1 = 100%，由字号+/-按钮调节并存到 localStorage */
            --md-font-scale: 1;
            /* 编辑光标定位同步命中时预览区块短暂闪一下的提示色 */
            --sync-highlight-bg: #fff59d;
        }

        [data-theme="dark"] {
            --apple-blue: #0A84FF; --apple-green: #30D158; --apple-red: #FF453A;
            --bg-base: #000000; --bg-surface: #1C1C1E; --text-main: #FFFFFF; --text-secondary: #EBEBF5;
            --border-color: #38383A; --header-bg: rgba(28, 28, 30, 0.85); --sidebar-bg: #151515;
            --sync-highlight-bg: #6b5b00;
        }
        
        html, body { height: 100%; width: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base); color: var(--text-main);
            display: flex; flex-direction: column;
        }

        /* ================= 2. 动态顶栏 ================= */
        /* 刘海安全区：原来先写 padding-top: env(safe-area-inset-top)，下一行 padding: 0 16px 又把它盖成 0，
           横屏时左右也没让出刘海。现在一次写全：上边让出状态栏，左右至少 16px、有刘海时让出刘海。 */
        header {
            flex-shrink: 0; height: calc(var(--header-height) + env(safe-area-inset-top));
            padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
            background: var(--header-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
            justify-content: space-between; z-index: 100;
        }

        /* 左右两侧按钮区域按内容实际宽度排布（不参与拉伸抢空间），标题区独占剩余空间自适应收缩，
           避免"返回"按钮在窄屏下被 flex:1 分配到的空间挤压，导致文字溢出盖住标题 */
        .header-section { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; min-width: 0; }
        .header-center { flex: 1; justify-content: center; text-align: center; min-width: 0; padding: 0 12px; }
        .header-right { justify-content: flex-end; gap: 2px; flex: 0 0 auto; min-width: 0; }

        /* 触摸区域至少 44×44（Apple HIG 建议值），图标本身大小不变，只是能点的范围变大 */
        .icon-btn { background: none; border: none; color: var(--apple-blue); flex-shrink: 0; font-size: 1.3rem; padding: 8px; min-width: 44px; min-height: 44px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .icon-btn:active { opacity: 0.5; }

        .text-btn { background: none; border: none; color: var(--apple-blue); flex-shrink: 0; font-size: 16px; font-weight: 500; padding: 6px 10px; min-height: 44px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
        /* 顶栏里的「编辑」「保存」蓝底按钮：可点范围 44 高，蓝底本身保持原来的大小（用内层背景画出来） */
        header .text-btn.primary { background: none; padding: 0; }
        header .text-btn.primary > .btn-face { background: var(--apple-blue); color: white; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
        header .text-btn.primary:active { background: none; opacity: 0.7; }
        .text-btn:active { background: rgba(128,128,128,0.2); }
        .text-btn.danger { color: var(--apple-red); }
        .text-btn.primary { background: var(--apple-blue); color: white; font-weight: 600; }
        .text-btn.primary:active { background: var(--apple-blue); opacity: 0.7; }

        .logo-text { font-weight: 700; font-size: 1.1rem; color: var(--apple-blue); cursor: pointer; flex-shrink: 0; }
        
        .file-title-display { font-weight: 600; font-size: 1rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: block; cursor: pointer; transition: opacity 0.2s; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
        .file-title-display:active { opacity: 0.4; }

        .hidden { display: none !important; }

        /* ================= 3. 布局与绝对滚动层 ================= */
        .app-container { flex-grow: 1; position: relative; display: flex; overflow: hidden; }

        .toc-sidebar { width: 250px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 0; transition: transform 0.3s ease, width 0.3s ease; flex-shrink: 0; z-index: 10; }
        @media (min-width: 768px) { .toc-sidebar.collapsed { width: 0; border: none; padding: 0; overflow: hidden; } }
        .toc-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; padding: 0 20px 10px; letter-spacing: 0.5px; }
        .toc-link { display: block; padding: 8px 20px; color: var(--text-main); text-decoration: none; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent; }
        .toc-link:active { background: rgba(128,128,128,0.1); }
        .toc-h1 { font-weight: 600; } .toc-h2 { padding-left: 30px; } .toc-h3 { padding-left: 40px; font-size: 13px; color: var(--text-secondary); }
        /* 四级标题原来没写，退回到 .toc-link 的 20px，比二、三级还浅 */
        .toc-h4 { padding-left: 50px; font-size: 13px; color: var(--text-secondary); }
        /* 阅读时高亮「当前读到的这一节」 */
        .toc-link.active { color: var(--apple-blue); border-left-color: var(--apple-blue); background: rgba(0, 122, 255, 0.08); }
        .toc-empty { padding: 20px; color: var(--text-secondary); font-size: 14px; }

        .main-content { flex-grow: 1; position: relative; background: var(--bg-surface); overflow: hidden; }
        .view-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg-surface); }

        /* ================= 4. 核心视图样式 ================= */
        .view-home { background: var(--bg-base); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .upload-card { background: var(--bg-surface); border-radius: 16px; padding: 40px; text-align: center; border: 1px solid var(--border-color); width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .upload-icon { font-size: 4rem; color: var(--apple-blue); margin-bottom: 20px; }
        .upload-title { font-size: 1.2rem; font-weight: 500; margin-bottom: 24px; color: var(--text-secondary); }
        /* 原来是苹果系统绿 #34C759 配白字，对比度只有 2.22:1（强光下看不清）；加深到 #218838，白字 4.52:1 达标，色相不变 */
        .btn-upload-lg { background: #218838; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s; }
        .btn-upload-lg:active { transform: scale(0.96); }

        .view-read { padding: 30px 20px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        .markdown-container { max-width: 900px; margin: 0 auto; }
        .markdown-body { background: transparent !important; color: inherit !important; font-family: inherit !important; font-size: calc(16px * var(--md-font-scale)) !important; }
        /* 文档里行内 style 是保留的（彩色文字要靠它），但 position:fixed + 大 z-index 能盖住整个应用。
           layout 包含让文档内容自成一个容器：fixed 的元素只相对正文定位、层级也出不去，不会盖住顶栏和菜单。 */
        #reader-content, #editor-preview { contain: layout; }
        /* 长的行间公式在自己的框里左右滑，不再把整篇文章撑宽（原来 390 宽手机上整页能左右拖） */
        .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
        /* Mermaid 图写错时，在图的位置显示提示和源码，不影响后面的目录等 */
        .mermaid-error { border: 1px solid var(--apple-red); border-radius: 8px; padding: 10px 12px; color: var(--apple-red); font-size: 14px; }
        .mermaid-error pre { margin: 8px 0 0 !important; color: var(--text-main); white-space: pre-wrap; }

        .markdown-body pre { position: relative; }
        .markdown-body .code-block-wrapper { position: relative; }
        .copy-code-btn { position: absolute; top: 8px; right: 8px; background: rgba(128, 128, 128, 0.2); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border: none; border-radius: 4px; padding: 4px 8px; font-size: 12px; color: var(--apple-blue); cursor: pointer; opacity: 0.6; transition: opacity 0.2s; z-index: 2; }
        /* 复制按钮本身只有 24px 高，用一层透明的伪元素把能点的范围扩到约 44px，按钮看起来不变 */
        .copy-code-btn::after { content: ''; position: absolute; inset: -10px -8px; }
        .copy-code-btn:hover { opacity: 1; }

        /* 长代码块行号：只在行数较多(>3行)的代码块上生成，避免给一两行的小代码块添乱。
           行号列和代码本身必须显式使用同一组 font/line-height，否则各自继承外部样式表可能导致行高对不齐。
           这里连 pre 本身也要一起锁死：github-markdown-css 给 pre 定义的是 font-size:85%/line-height:1.45
           这种跟随父级字号走的相对值，如果只固定 code 不固定 pre，阅读字号一放大/缩小，pre 自己的行高
           还是会跟着变，行号列（本身固定13px/1.6）就会跟代码对不上——所以阅读字号缩放绝不能影响代码块，
           连 pre 这一层也要显式钉死，不能只钉里面的 code */
        .markdown-body pre, .markdown-body pre code, .line-numbers-rows {
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace !important;
            font-size: 13px !important; line-height: 1.6 !important;
        }
        .code-block-wrapper.with-line-numbers { display: flex; align-items: stretch; }
        .code-block-wrapper.with-line-numbers pre { flex: 1; min-width: 0; }
        /* 行号是否显示由用户开关决定，默认关闭：这里默认 display:none，
           只有 body 带上 show-line-numbers 时才显示，隐藏的 gutter 不占 flex 空间，pre 会自动填满整行 */
        .line-numbers-rows {
            display: none;
            flex-shrink: 0; user-select: none; text-align: right; color: var(--text-secondary); opacity: 0.5;
            /* 上下内边距必须跟 github-markdown-css 给 pre 的 padding:16px 一样。原来写 1em，这里字号 13px，
               1em=13px，行号整体比代码高 3px、对不齐 */
            padding: 16px 10px 16px 0; margin-right: 4px; border-right: 1px solid var(--border-color);
        }
        body.show-line-numbers .line-numbers-rows { display: block; }
        .line-numbers-rows span { display: block; }
        .icon-btn.active { background: rgba(0, 122, 255, 0.15); }

        .markdown-body .mermaid-wrapper { position: relative; }
        .markdown-body .mermaid { overflow-x: auto; padding: 8px 0; }
        .markdown-body .mermaid svg { max-width: 100%; }

        /* 编辑预览里每个顶层块前面的空行号标记（光标同步用，见 annotateBlocks）。零高度、不占位，
           上下两块的外边距照样穿过它折叠，排版跟阅读视图一样。github-markdown-css 用
           .markdown-body>:first-child 去掉第一块的上边距，第一个子元素变成标记后要补到它后面那块上。 */
        .kb-block-mark { display: block; height: 0; margin: 0; padding: 0; }
        .markdown-body > .kb-block-mark:first-child + * { margin-top: 0 !important; }
        /* 脚注区的「脚注」标题：跟 GitHub 一样留给读屏软件、视觉上藏起来。github-markdown-css 不带这个类。 */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        .view-edit { display: flex; flex-direction: column; overflow: hidden; }
        .edit-pane, .preview-pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        .edit-pane { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); }
        .preview-pane { background: var(--bg-base); }
        #editor-textarea { width: 100%; height: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6; padding: 5px; }

        /* 编辑光标定位同步：光标移动到源码某一行时，预览区对应block短暂闪一下
           提示"就是这一块"，跟markdown-reader既有的高亮反馈风格（比如复制成功
           按钮变对勾）保持同一种"轻量瞬时反馈"的调性。 */
        /* 高亮目标现在不一定是 editor-preview 的直接子元素了——粒度细化之后
           也可能是列表项 li 或表格行 tr（见 scrollPreviewToCursor），所以这里
           不能再用 ">" 直接子选择器，否则细粒度定位过去了却不会闪高亮。 */
        #editor-preview .sync-highlight { animation: sync-highlight-flash 0.9s ease-out; border-radius: 6px; }
        @keyframes sync-highlight-flash { from { background: var(--sync-highlight-bg); } to { background: transparent; } }

        /* 手机上编辑和预览改成两个标签切换（原来上下各占半屏，键盘一弹编辑区只剩一小条）。
           电脑上照旧左右并排，这一排标签不显示。 */
        .edit-tabs { display: none; }
        @media (max-width: 767px) {
            .edit-tabs { display: flex; flex-shrink: 0; gap: 0; padding: 6px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-color); }
            .edit-tabs .seg { flex: 1; display: flex; background: rgba(118, 118, 128, 0.12); border-radius: 9px; padding: 2px; }
            .edit-tabs button { flex: 1; min-height: 36px; border: none; background: none; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--text-main); cursor: pointer; transition: background 0.2s, box-shadow 0.2s; }
            .edit-tabs button.on { background: var(--bg-surface); box-shadow: 0 1px 4px rgba(0,0,0,0.15); font-weight: 600; }
            [data-theme="dark"] .edit-tabs button.on { background: #636366; }
            .view-edit.tab-edit .preview-pane { display: none; }
            .view-edit.tab-preview .edit-pane { display: none; }
            .view-edit .edit-pane { border-bottom: none; }
        }

        @media (min-width: 768px) { .view-edit { flex-direction: row; } .edit-pane { border-bottom: none; border-right: 1px solid var(--border-color); } .mobile-only { display: none !important; } }
        @media (max-width: 767px) { 
            /* 收起时不带阴影：原来收起的目录栏藏在屏幕左外侧，阴影却漏进屏幕，每个界面左边缘都有一条灰带 */
            .toc-sidebar { position: fixed; top: 0; bottom: 0; left: -280px; width: 280px; height: auto; z-index: 201; box-shadow: none; padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s; } 
            .toc-sidebar.mobile-open { transform: translateX(280px); box-shadow: 2px 0 20px rgba(0,0,0,0.2); } 
            .desktop-only { display: none !important; } 
            /* 右下角悬浮目录按钮（50px + 底部 20px）会盖住文末一两行，文末留出它的位置 */
            .view-read { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
        }

        /* ================= 5. 左侧历史/文件夹抽屉 ================= */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s; }
        /* 原来 height:100vh：iPhone Safari 的 100vh 比可见区域高（按地址栏收起后算），文档多时最底下几篇会被工具栏挡住。
           改成上下都钉在屏幕边上（top:0 + bottom:0），高度就是实际可见的那么高。横屏有刘海时左边让出来。 */
        .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: calc(280px + env(safe-area-inset-left)); padding-left: env(safe-area-inset-left); background: var(--bg-surface); z-index: 201; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; }
        .drawer-header { padding: 20px; border-bottom: 1px solid var(--border-color); margin-top: env(safe-area-inset-top); font-weight: 600; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .drawer-content { overflow-y: auto; flex-grow: 1; padding-bottom: env(safe-area-inset-bottom); }
        
        .menu-action { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: var(--apple-blue); font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .menu-action:active { background: rgba(128,128,128,0.1); }
        
        /* 文件夹及拖拽样式 */
        .folder-group { border-bottom: 1px solid var(--border-color); transition: border 0.2s; }
        .folder-group.dragging { opacity: 0.4; background: var(--bg-base); }
        /* 往上拖：蓝线画在目标上方、插到它前面；往下拖：画在下方、插到它后面（原来一律画上方，往下拖时实际插到后面，提示是反的） */
        .folder-group.drag-before { box-shadow: inset 0 2px 0 var(--apple-blue); }
        .folder-group.drag-after { box-shadow: inset 0 -2px 0 var(--apple-blue); }
        .folder-group.touch-dragging { position: relative; z-index: 5; opacity: 0.85; box-shadow: 0 6px 20px rgba(0,0,0,0.18); transition: none; }
        
        .folder-header { padding: 0 8px 0 20px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--bg-base); cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .folder-header:active { background: var(--border-color); }
        /* 很长的英文文件夹名原来会把右边三个按钮挤出侧边栏：名字这一侧可以收缩并显示省略号，按钮那一侧不收缩 */
        .folder-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); flex: 1; min-width: 0; min-height: 44px; }
        .folder-info .folder-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-icon { color: var(--apple-gray); width: 16px; text-align: center; flex-shrink: 0; }
        .folder-actions { display: flex; gap: 0; color: var(--text-secondary); flex-shrink: 0; }
        .folder-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; padding: 4px; min-width: 36px; min-height: 44px; transition: color 0.2s; }
        .folder-btn:active { color: var(--apple-blue); }
        
        .folder-files { display: none; background: var(--bg-surface); }
        .folder-group.open .folder-files { display: block; }
        .folder-group.open .fa-chevron-right { transform: rotate(90deg); }
        .fa-chevron-right { transition: transform 0.2s; font-size: 12px; color: var(--text-secondary); }

        /* 文件项样式 */
        .history-item { padding: 12px 16px 12px 36px; display: flex; align-items: center; position: relative; border-bottom: 1px solid var(--border-color); }
        .history-item:last-child { border-bottom: none; }
        .history-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; cursor: pointer; padding-right: 10px; }
        /* 外层是 flex（要放置顶图标），flex 容器自己的 text-overflow 不生效——原来长文件名被硬切、没有省略号。
           省略号放到里面的文字 span 上。 */
        .history-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; display: flex; align-items: center; color: var(--text-main); min-width: 0; }
        .history-title .history-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-snippet { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-date { font-size: 11px; color: var(--text-secondary); }
        .history-more-btn { background: none; border: none; color: var(--text-secondary); padding: 8px 12px; min-width: 44px; min-height: 44px; cursor: pointer; border-radius: 6px; font-size: 16px; flex-shrink: 0; }
        .history-more-btn:active, .history-more-btn.active { background: rgba(128,128,128,0.15); color: var(--text-main); }
        
        /* 悬浮菜单 & Tooltip */
        .mobile-action-menu { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; right: 10px; background: var(--header-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 -8px 30px rgba(0,0,0,0.12); z-index: 300; display: none; flex-direction: column; padding: 8px 0; max-height: 80vh; overflow-y: auto; }
        .mobile-action-menu.show { display: flex; animation: slideInUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .action-item { padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: var(--apple-blue); font-weight: 500; font-size: 17px; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .action-item:last-child { border-bottom: none; }
        .action-item:active { background: rgba(128,128,128,0.15); }
        .action-item.danger { color: var(--apple-red); }
        .action-item.success { color: var(--apple-green); }
        .action-item.title { font-size: 12px; color: var(--text-secondary); justify-content: center; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px; cursor: default; border-bottom: none; }
        .action-item.title:active { background: none; }
        .action-item i { width: 20px; text-align: center; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .title-tooltip { position: fixed; top: calc(var(--header-height) + env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%); background: var(--header-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); color: var(--text-main); padding: 10px 18px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 1px solid var(--border-color); z-index: 1000; max-width: 90vw; word-break: break-all; font-weight: 500; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .title-tooltip.show { opacity: 1; pointer-events: auto; }

        .fab-toc { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px; width: 50px; height: 50px; border-radius: 25px; background: var(--apple-blue); color: white; border: none; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); font-size: 20px; z-index: 150; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, opacity 0.2s, background 0.2s; }
        .fab-toc:active { transform: scale(0.9); background: #005ecb; }

        /* ================= 6. 页面内弹框（替代浏览器原生 alert/confirm/prompt） =================
           样式照 iOS 的警告框：屏幕正中、标题加粗、两个按钮左右并排、三个以上竖排，危险操作红字。
           原生弹框在 iPhone 上顶部还会显示网址，也没法统一深色模式。 */
        .dlg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; transition: opacity 0.2s; }
        .dlg-overlay.show { opacity: 1; }
        /* 底色几乎不透明：毛玻璃没渲染出来的环境里（省电模式、部分安卓），后面的正文透上来会跟弹框文字叠在一起 */
        .dlg { width: 100%; max-width: 300px; background: rgba(250, 250, 252, 0.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 14px; overflow: hidden; transform: scale(1.08); transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
        [data-theme="dark"] .dlg { background: rgba(44, 44, 46, 0.96); }
        .dlg-overlay.show .dlg { transform: scale(1); }
        .dlg-body { padding: 18px 16px 16px; text-align: center; }
        .dlg-title { font-size: 17px; font-weight: 600; color: var(--text-main); word-break: break-word; }
        .dlg-msg { margin-top: 6px; font-size: 13px; line-height: 1.45; color: var(--text-main); white-space: pre-line; word-break: break-word; }
        .dlg-input { margin-top: 14px; width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-main); outline: none; }
        .dlg-input:focus { border-color: var(--apple-blue); }
        .dlg-btns { display: flex; border-top: 1px solid var(--border-color); }
        .dlg-btns.vertical { flex-direction: column; }
        .dlg-btn { flex: 1; min-height: 44px; border: none; background: none; font-size: 17px; color: var(--apple-blue); cursor: pointer; padding: 10px 8px; }
        .dlg-btns:not(.vertical) .dlg-btn + .dlg-btn { border-left: 1px solid var(--border-color); }
        .dlg-btns.vertical .dlg-btn + .dlg-btn { border-top: 1px solid var(--border-color); }
        .dlg-btn:active { background: rgba(128,128,128,0.15); }
        .dlg-btn.bold { font-weight: 600; }
        .dlg-btn.destructive { color: var(--apple-red); }

        /* 轻提示：复制成功之类只闪一下，不用点「确定」 */
        .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); background: rgba(30,30,32,0.92); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 2100; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px); text-align: center; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* 「回到上次读到的位置」：打开读过的文档时在底部出现几秒，点了才跳，不自动跳 */
        .resume-pill { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 160; display: flex; align-items: center; background: var(--header-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--border-color); border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); max-width: calc(100vw - 32px - 70px); }
        .resume-pill.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .resume-pill button { background: none; border: none; color: var(--apple-blue); font-size: 15px; font-weight: 500; min-height: 44px; padding: 0 6px 0 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .resume-pill .resume-close { color: var(--text-secondary); padding: 0 14px 0 8px; min-width: 40px; }
        @media (max-width: 767px) { .resume-pill { left: 16px; transform: translateY(20px); } .resume-pill.show { transform: translateY(0); } }

        /* 首页：继续阅读 */
        .continue-btn { margin-top: 14px; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: rgba(0, 122, 255, 0.08); border: 1px solid rgba(0, 122, 255, 0.2); border-radius: 10px; padding: 10px 14px; cursor: pointer; color: var(--text-main); min-height: 44px; }
        .continue-btn:active { opacity: 0.6; }
        .continue-btn .cl { font-size: 12px; color: var(--apple-blue); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .continue-btn .ct { font-size: 15px; font-weight: 500; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .home-hint { margin-top: 14px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

        /* 侧边栏搜索 */
        .drawer-search { padding: 10px 16px; border-bottom: 1px solid var(--border-color); position: relative; }
        .drawer-search input { width: 100%; font-size: 16px; padding: 8px 34px 8px 32px; border-radius: 10px; border: none; background: rgba(118, 118, 128, 0.12); color: var(--text-main); outline: none; -webkit-appearance: none; appearance: none; }
        .drawer-search .fa-magnifying-glass { position: absolute; left: 27px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 13px; pointer-events: none; }
        .drawer-search .search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); min-width: 40px; min-height: 40px; cursor: pointer; }
        .search-empty { padding: 20px; font-size: 13px; color: var(--text-secondary); text-align: center; }
        .history-item.search-hit { padding-left: 16px; }

        /* 阅读页顶部：这篇有未保存的草稿 */
        .draft-bar { max-width: 900px; margin: 0 auto 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(255, 149, 0, 0.12); border: 1px solid rgba(255, 149, 0, 0.35); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: 14px; color: var(--text-main); }
        .draft-bar .dt { flex: 1 1 160px; min-width: 0; }
        .draft-bar button { background: none; border: none; color: var(--apple-blue); font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 10px; cursor: pointer; border-radius: 8px; }
        .draft-bar button.danger { color: var(--apple-red); }

    </style>
</head>

    </div>

    <script>
        const { markedHighlight } = globalThis.markedHighlight;

        // ================= 数学公式（KaTeX） =================
        // 2026-10-06 换掉了 marked-katex-extension：它的规则要求 $ 前后必须是空格或标点，
        // 中文里公式几乎都是紧贴着字写的——「面积是$\pi r^2$平方米」「质能方程：$E = mc^2$」
        // 实测原样显示成 $…$。分词规则改成跟 MyKnowledgeBase（public/math-extension.js）
        // 完全一样，两个站从此对同一份 markdown 判出同样的公式；渲染仍然用 KaTeX。
        // 规则：$$…$$ 是行间公式；$…$ 是行内公式，前后不要求空格；但看起来像金额的不算——
        // 「$5$」「$19.99，那件 $5」这类（收尾的 $ 后紧跟数字，或者开头就是金额）。
        function looksLikeMoney(inner, restAfterMatch) {
            if (/^\d[\d,]*(\.\d{1,2})?$/.test(inner)) return true;
            if (/^\d[\d,]*(\.\d{1,2})?[，,。.、]/.test(inner)) return true;
            if (restAfterMatch && /[\d,]/.test(restAfterMatch[0])) return true;
            return false;
        }
        const mathExtension = {
            name: 'math',
            level: 'inline',
            start(src) { return src.indexOf('$'); },
            tokenizer(src) {
                let match;
                if ((match = /^\$\$([\s\S]+?)\$\$/.exec(src))) {
                    return { type: 'math', raw: match[0], text: match[1], displayMode: true };
                }
                // (?:\\.|[^$\n]) 让 \$ 这种转义的美元符号不会提前结束公式
                if ((match = /^\$((?:\\.|[^$\n])+?)\$/.exec(src))) {
                    if (looksLikeMoney(match[1].trim(), src.slice(match[0].length))) return false;
                    return { type: 'math', raw: match[0], text: match[1], displayMode: false };
                }
                return false;
            },
            renderer(token) {
                return katex.renderToString(token.text.trim(), { throwOnError: false, displayMode: token.displayMode, output: 'html' });
            }
        };

        // ================= 裸链接在中文标点处截断 =================
        // GFM 规定裸链接一直延伸到空白或 < 为止，英文里 URL 后面总有空格，中文句子里没有——
        // 「（来源：示例，https://example.com/a.html）。后面一句话。」会把「）。后面一句话。」
        // 整段吞进链接（2026-10-06 实测）。跟 MyKnowledgeBase 的 public/cjk-autolink.js 同一套规则：
        // 在第一个中文/全角标点处截断（汉字本身不截，维基百科、百度百科的词条路径里就是汉字），
        // 截完再按 marked 原本的规则去掉末尾英文标点。
        // URL_START_RE / BACKPEDAL_RE 跟 marked@15.0.12 源码里的 inline.url / _backpedal 逐字一致。
        const URL_START_RE = /^((?:ftp|https?):\/\/|www\.)(?:[a-zA-Z0-9\-]+\.?)+[^\s<]*/i;
        const CJK_PUNCT_RE = /[　-〿＀-￯‘’“”…—]/;
        const BACKPEDAL_RE = /(?:[^?!.,:;*_'"~()&]+|\([^)]*\)|&(?![a-zA-Z0-9]+;$)|[?!.,:;*_'"~)]+(?!$))+/;
        const cjkAutolinkTokenizer = {
            url(src) {
                const m = URL_START_RE.exec(src);
                if (!m) return false; // 交还 marked 原本的规则（邮箱自动链接走那里）
                let raw = m[0];
                const cut = raw.search(CJK_PUNCT_RE);
                if (cut !== -1) raw = raw.slice(0, cut);
                let prev;
                do { prev = raw; raw = (BACKPEDAL_RE.exec(raw) || [''])[0]; } while (prev !== raw);

FA-\uDFFF]|\uD869[\uDEDE-\uDEFF]|\uD86D[\uDF35-\uDF3F]|\uD86E[\uDC1E\uDC1F]|\uD873[\uDEA2-\uDEAF]|\uD87A[\uDFE1-\uDFFF]|\uD87E[\uDE1E-\uDFFF]|\uD884[\uDF4B-\uDFFF]|\uDB40[\uDC00-\uDCFF\uDDF0-\uDFFF]/g;
        function slugify(text, usedSlugs) {
            const base = String(text).toLowerCase().replace(SLUG_REMOVE_RE, '').replace(/ /g, '-') || 'section';
            let unique = base, i = 1;
            while (usedSlugs.has(unique)) unique = `${base}-${i++}`;
            usedSlugs.add(unique);
            return unique;
        }

        // ================= 核心状态与数据管理 =================
        let currentState = 'home';
        // 当前打开的文档。它只是 localStorage 里那一条的快照：凡是要改库，一律先重新读最新的库再改（见 mutateDB）
        let currentFile = null;
        // 进入编辑时的内容：判断「有没有改动」的基准，也是保存时检测「编辑期间别的页面改过这篇」的基准
        let originalContent = '';

        // 本站自己新加的 localStorage 键都用 mdr- 开头：同一个 fjkkx77.github.io 下的姊妹站（数学公式阅读器）
        // 跟本站共用同一个存储，md-pro-db / md-theme / md-font-scale 两站是同一份，新键别跟它们撞。
        function lsGet(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
        function lsSet(key, value) { try { localStorage.setItem(key, value); return true; } catch (_) { return false; } }
        function lsRemove(key) { try { localStorage.removeItem(key); } catch (_) {} }

        // 排序状态读取 (desc=最新在前, asc=最旧在前)
        let sortOrder = lsGet('md-pro-sort') || 'desc';

        const DB_KEY = 'md-pro-db';
        const defaultDB = {
            folders: [{ id: 'root', name: '默认文件夹', isOpen: true }],
            files: []
        };
        const cloneDefaultDB = () => JSON.parse(JSON.stringify(defaultDB));

        // 拼进 innerHTML 的文件名/文件夹名一律先转义：文件名来自用户本机任意 .md
        //（macOS / 安卓 / Linux 的文件名可以带 < >），形如 <img src=x onerror=…>.md 的文件名
        // 原来在侧边栏和操作菜单里会被当成 HTML 执行（标题提示框那条路早就用 textContent 了，这两处漏了）。
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 数据损坏、而且原始数据没能另存成功（空间也满了）时为 true：这时任何保存都会把唯一一份原始数据覆盖掉，
        // 所以在用户把原始数据下载下来之前，saveDB 一律拒绝。
        let dbCorruptUnbacked = false;
        let corruptRaw = '';
        let corruptBackupKey = 'md-pro-db-corrupt-backup';

        function getDB() {
            let rawStr = lsGet(DB_KEY);
            if (!rawStr) { corruptRaw = ''; dbCorruptUnbacked = false; return cloneDefaultDB(); }
            // 这份损坏内容已经处理过（见下面 catch 里的说明）：不用再花时间解析几 MB 的坏数据
            if (corruptRaw && rawStr === corruptRaw) return cloneDefaultDB();
            try {
                let parsed = JSON.parse(rawStr);
                // 能正常解析了（比如在另一个标签页里修好了）：损坏状态解除，别再拦着保存
                corruptRaw = ''; dbCorruptUnbacked = false;
                if (Array.isArray(parsed)) {
                    let migratedDB = cloneDefaultDB();
                    parsed.forEach(f => { f.folderId = 'root'; migratedDB.files.push(f); });
                    lsSet(DB_KEY, JSON.stringify(migratedDB));
                    return migratedDB;
                }
                if (!parsed || !Array.isArray(parsed.folders) || !Array.isArray(parsed.files)) throw new Error('文档库结构不对');
                if (!parsed.folders.some(f => f && f.id === 'root')) parsed.folders.unshift({ id: 'root', name: '默认文件夹', isOpen: true });
                return parsed;
            } catch (e) {
                // 存的数据解析不了时，原来直接返回空库——下一次任何保存都会把它写回去，
                // 所有文档就此永久消失。先把原文另存一份，再提示用户，至少还有得救。
                // 2026-10-09：原来备份没写进去（空间满）也照样提示「已另存」；另外已经有一份旧备份、
                // 这次损坏的内容跟它不一样时，这次的根本没存。现在按「这份原文到底存没存上」来判断。
                // 同一份损坏内容只处理一次：getDB 调用得很频繁（侧边栏、搜索、每次保存），原来每调一次都可能再写一份
                // 带时间戳的整库副本把空间写满；用户下载了原始数据之后，下一次 getDB 又把「没备份」标记打回去，永远存不了。
                //（「同一份只处理一次」的判断放在 try 前面，见函数开头）
                let backedUp = false;
                try {
                    // 已经有一份内容相同的备份（不管是哪个键）就不再写；记下这份原文实际存在哪个键，提示里要写对
                    for (let k = 0; k < localStorage.length; k++) {
                        const key = localStorage.key(k);
                        if (key && key.startsWith('md-pro-db-corrupt-backup') && localStorage.getItem(key) === rawStr) { backedUp = true; corruptBackupKey = key; break; }
                    }
                    if (!backedUp) {
                        const key = localStorage.getItem('md-pro-db-corrupt-backup') === null ? 'md-pro-db-corrupt-backup' : 'md-pro-db-corrupt-backup-' + Date.now();
                        localStorage.setItem(key, rawStr);
                        backedUp = true; corruptBackupKey = key;
                    }
                } catch (_) { backedUp = false; }
                corruptRaw = rawStr;
                dbCorruptUnbacked = !backedUp;
                if (!getDB.warned) {
                    getDB.warned = true;
                    setTimeout(() => warnCorrupt(backedUp), 0);
                }
                return cloneDefaultDB();
            }
        }

        async function warnCorrupt(backedUp) {
            const v = await ask({
                title: '文档数据损坏',
                message: backedUp
                    ? `本地保存的文档数据读不出来。原始数据已经另存在浏览器里（localStorage 的 ${corruptBackupKey}），请先别清除浏览器数据；也建议现在把原始数据下载下来保存好。`
                    : '本地保存的文档数据读不出来，而且浏览器空间不够，没能另存备份。为了不覆盖这份原始数据，下载下来之前暂时不能保存任何修改。',
                buttons: [{ text: '稍后', value: 'later', style: 'cancel' }, { text: '下载原始数据', value: 'dl', bold: true }]
            });
            if (v === 'dl') {
                downloadText(`markdown-reader-损坏数据-${dateStamp()}.txt`, corruptRaw, 'text/plain;charset=utf-8');
                dbCorruptUnbacked = false;
            }
        }

        const SAVE_FAIL_EDIT = '浏览器本地存储空间已满（或被禁用）。\n这次的修改还在编辑框里，请先复制出来，再删掉一些不用的文档后重试。';
        const SAVE_FAIL_GENERIC = '浏览器本地存储空间已满（或被禁用），这次的改动没有存上。\n请删掉一些不用的文档后重试。';

        // 返回是否真的存上了。localStorage 一般只有 5MB 左右，存满时 setItem 会抛 QuotaExceededError，
        // 原来没接住：点「保存」时异常直接冒出去，界面停在编辑页、什么提示都没有，像是点了没反应。
        // failMsg 按场景给（原来一律说「修改还在编辑框里」，导入、新建时这句话是错的）。
        function saveDB(db, failMsg) {
            if (dbCorruptUnbacked) { warnCorrupt(false); return false; }
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            } catch (e) {
                showAlert('保存失败', failMsg || SAVE_FAIL_GENERIC);
                return false;
            }
            renderDrawer(); // 侧边栏关着时它自己会跳过
            maybeRequestPersist();
            return true;
        }

        // 在「此刻最新」的库上改一处再存回去。
        // 原来侧边栏画出来时把整个库读进内存，之后展开文件夹、改名、置顶、移动、删除、拖动排序都是改这份
        // 旧副本再整份写回——同时开着两个标签页（或姊妹站数学公式阅读器）时，一边随手点一下文件夹，
        // 就把另一边刚保存的内容、刚新建的文档整份冲掉（审查报告 P1-2）。fn 返回 false 表示不用存。
        function mutateDB(fn, failMsg) {
            const db = getDB();
            if (fn(db) === false) return false;
            return saveDB(db, failMsg);
        }

        function newId() { return Date.now().toString() + Math.random().toString(36).slice(2, 6); }

        // 新建一篇放进默认文件夹，返回存上的那条；没存上返回 null（saveDB 已经弹了提示）
        function createFile(title, content, failMsg) {
            const file = { id: newId(), title, content, timestamp: Date.now(), isPinned: false, folderId: 'root' };
            return mutateDB(db => { db.files.unshift(file); }, failMsg) ? file : null;
        }

        // 申请「持久存储」：Chrome 等浏览器在空间紧张时就不会自动清掉本站数据。
        // 能不能豁免 Safari 的「7 天没打开就清空」不确定（WebKit 没写明），所以真正的保险还是「备份与恢复」。
        // 放在第一次成功保存之后调用（有用户操作在前，Firefox 弹的授权框也不显得突兀），每次打开页面最多一次。
        function maybeRequestPersist() {
            if (maybeRequestPersist.done) return;
            maybeRequestPersist.done = true;
            try {
                if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
                    navigator.storage.persisted().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {});
                }
            } catch (_) {}
        }

        // ================= DOM 元素获取 =================
        // 侧边栏、首页这些固定元素全部在这里一次取好。原来渲染侧边栏时现查 getElementById('history-list')，

        const isMobileWidth = () => window.innerWidth < 768;

        // ================= 页面内弹框（替代 alert / confirm / prompt） =================
        // 原来 13 处用的是浏览器原生弹框：iPhone 上顶部会显示网址、深色模式下还是白的、复制成功也要点一下「确定」。
        // ask() 返回 Promise，结果是被点按钮的 value（带输入框时是 { value, text }）。按 Esc 等于点 style:'cancel'
        // 的那个按钮（没有就是 null），回车等于点 bold 的那个。同一时间只显示一个，后来的排队。
        const dialogQueue = [];
        let dialogOpen = false;
        function ask(opts) {
            return new Promise(resolve => {
                dialogQueue.push({ ...opts, resolve });
                if (!dialogOpen) nextDialog();
            });
        }
        function nextDialog() {
            const d = dialogQueue.shift();
            if (!d) { dialogOpen = false; return; }
            dialogOpen = true;
            const buttons = d.buttons && d.buttons.length ? d.buttons : [{ text: '好', value: true, bold: true }];
            const prevFocus = document.activeElement;

            const ov = document.createElement('div'); ov.className = 'dlg-overlay';
            const box = document.createElement('div'); box.className = 'dlg';
            box.setAttribute('role', 'alertdialog'); box.setAttribute('aria-modal', 'true');
            const body = document.createElement('div'); body.className = 'dlg-body';
            if (d.title) { const t = document.createElement('div'); t.className = 'dlg-title'; t.textContent = d.title; body.appendChild(t); }
            if (d.message) { const m = document.createElement('div'); m.className = 'dlg-msg'; m.textContent = d.message; body.appendChild(m); }
            let input = null;
            if (d.input) {
                input = document.createElement('input'); input.className = 'dlg-input'; input.type = 'text';
                input.value = d.input.value || ''; input.placeholder = d.input.placeholder || '';
                input.setAttribute('enterkeyhint', 'done');
                body.appendChild(input);
            }
            const row = document.createElement('div');
            row.className = 'dlg-btns' + (buttons.length > 2 ? ' vertical' : '');
            let finished = false;
            const finish = (value) => {
                if (finished) return;
                finished = true;
                document.removeEventListener('keydown', onKey, true);
                ov.classList.remove('show');
                setTimeout(() => ov.remove(), 200);
                // 触屏上不把焦点还给编辑框：一还回去键盘就弹出来
                if (prevFocus && prevFocus.focus && !matchMedia('(pointer: coarse)').matches) { try { prevFocus.focus({ preventScroll: true }); } catch (_) {} }
                d.resolve(input ? { value, text: input.value } : value);
                setTimeout(nextDialog, 0);
            };
            const btnEls = buttons.map(b => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'dlg-btn' + (b.bold ? ' bold' : '') + (b.style === 'destructive' ? ' destructive' : '');
                el.textContent = b.text;
                el.onclick = () => finish(b.value);
                row.appendChild(el);
                return el;
            });
            const cancelBtn = buttons.find(b => b.style === 'cancel');
            // 回车 = 加粗的那个；没有加粗的就取第一个不危险的。危险操作（删除、替换）永远不当默认，跟 iOS 一样
            const defaultBtn = buttons.find(b => b.bold) || buttons.find(b => b.style !== 'destructive') || buttons[0];
            const onKey = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(cancelBtn ? cancelBtn.value : null); }
                else if (e.key === 'Enter' && !e.isComposing && (e.target === input || !e.target.closest || !e.target.closest('.dlg-btn'))) { e.preventDefault(); e.stopPropagation(); finish(defaultBtn.value); }
                else if (e.key === 'Tab') {
                    // 焦点关在弹框里
                    const focusables = [input, ...btnEls].filter(Boolean);
                    const i = focusables.indexOf(document.activeElement);
                    e.preventDefault();
                    focusables[(i + (e.shiftKey ? -1 : 1) + focusables.length) % focusables.length].focus();
                }
                else if (!box.contains(e.target)) { e.stopPropagation(); }
            };
            document.addEventListener('keydown', onKey, true);
            box.appendChild(body); box.appendChild(row); ov.appendChild(box);
            document.body.appendChild(ov);
            void ov.offsetWidth;
            ov.classList.add('show');
            if (input) { input.focus(); input.select(); }
            else { const fb = btnEls[buttons.indexOf(defaultBtn)]; if (fb) fb.focus({ preventScroll: true }); }
        }
        function showAlert(title, message) { return ask({ title, message, buttons: [{ text: '好', value: true, bold: true }] }); }
        async function confirmAsk(title, message, okText = '确定', destructive = false) {
            const v = await ask({ title, message, buttons: [{ text: '取消', value: false, style: 'cancel' }, { text: okText, value: true, bold: !destructive, style: destructive ? 'destructive' : 'default' }] });
            return v === true;
        }
        // 返回去掉首尾空格的文字；取消或者是空的返回 null
        async function promptAsk(title, value = '', okText = '确定', placeholder = '') {
            const r = await ask({ title, input: { value, placeholder }, buttons: [{ text: '取消', value: false, style: 'cancel' }, { text: okText, value: true, bold: true }] });
            if (!r || r.value !== true) return null;
            const t = r.text.trim();
            return t ? t : null;
        }

        let toastTimer = null;
        function notify(msg, ms = 1800) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        // ================= 遮罩层的显示 / 隐藏 =================
        // 原来关上时用 setTimeout 300ms 再把遮罩 display:none，开的时候不取消这个计时——
        // 关上后 0.3 秒内再打开，遮罩会被那个迟到的计时藏掉，点空白处就关不掉了（P3-11）。
        function showLayer(el) {
            clearTimeout(el._hideTimer);
            el.style.display = 'block';
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        function hideLayer(el) {
            el.style.opacity = '0';
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 300);
        }

        // ================= 小工具 =================
        function dateStamp() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        }
        function fmtTime(ts) {
            const d = new Date(ts);
            const p = n => String(n).padStart(2, '0');
            const today = new Date();
            const sameDay = d.toDateString() === today.toDateString();
            return (sameDay ? '今天' : `${d.getMonth() + 1}月${d.getDate()}日`) + ` ${p(d.getHours())}:${p(d.getMinutes())}`;
        }
        // 把文字下载成文件。iPhone Safari 13 起支持 a[download]，会弹出「下载」确认
        function downloadText(filename, text, mime) {
            const blob = new Blob([text], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.rel = 'noopener';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
        // Windows / macOS 文件名里不允许的字符换成下划线
        function safeFileName(name) {
            const s = String(name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/^\.+/, '').trim();
            return (s || '未命名文档').slice(0, 120);
        }
        function downloadDoc(file) { downloadText(safeFileName(file.title) + '.md', file.content, 'text/markdown;charset=utf-8'); }

        // ================= UI 状态机控制 =================
        // 顶栏按钮、悬浮目录按钮、目录侧栏这些「外壳」：只跟当前状态和屏幕宽度有关，跟内容无关。
        // 单独拆出来，是因为窗口宽度跨过 768 断点时只该刷新外壳（见下面的 resize 监听）。
        function applyChrome(state) {
            const isMobile = isMobileWidth();
            btnFabToc.classList.add('hidden');
            Object.values(headerUI).forEach(el => { if(el && el.id !== 'btn-hamburger') el.classList.add('hidden'); });

            if (state === 'home') {
                headerUI.headerLogo.classList.remove('hidden');
                headerUI.btnHomeSample.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                tocSidebar.classList.add('collapsed');
            } else if (state === 'read') {
                headerUI.btnBack.classList.remove('hidden');
                headerUI.headerTitle.classList.remove('hidden'); headerUI.headerTitle.textContent = currentFile.title;
                if(isMobile) {
                    headerUI.btnReadMore.classList.remove('hidden');
                    btnFabToc.classList.remove('hidden');
                } else {
                    headerUI.btnReadCopy.classList.remove('hidden'); headerUI.btnReadDownload.classList.remove('hidden');
                    headerUI.btnReadEdit.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                    headerUI.btnFontDec.classList.remove('hidden'); headerUI.btnFontInc.classList.remove('hidden');
                    headerUI.btnFontReset.classList.remove('hidden');
                    headerUI.btnLinenumToggle.classList.remove('hidden');
                }
                updateTocLayout();
            } else if (state === 'edit') {
                headerUI.headerTitle.classList.remove('hidden'); headerUI.headerTitle.textContent = "编辑: " + currentFile.title;
                if(isMobile) {
                    headerUI.btnBack.classList.remove('hidden');
                    headerUI.btnEditMore.classList.remove('hidden');
                } else {
                    headerUI.btnEditCancel.classList.remove('hidden');
                    headerUI.btnEditReset.classList.remove('hidden');
                    headerUI.btnEditSave.classList.remove('hidden'); headerUI.btnTheme.classList.remove('hidden');
                }
                tocSidebar.classList.add('collapsed');
            }
        }

        // 阅读区「上一次显示的是哪篇」：从编辑页回来还是同一篇时保留原来的滚动位置；换了一篇就从头显示
        //（原来换文档会沿用上一篇的滚动位置，一打开就在中间某处，P2-5）。
        let lastReadFileId = null, lastReadScroll = 0;

        async function switchState(newState) {
            const prevState = currentState;
            if (prevState === 'read') { saveReadPos(); lastReadScroll = vRead.scrollTop; }
            // 离开编辑页（包括直接换到另一篇的编辑页）就删掉刚才那篇的草稿：能走到这里的出口都已经有了结论——
            // 保存了、点了放弃、在 confirmLeaveEdit 里选了「不保存」、删除了这篇，或者根本没改。
            // 草稿只在「人还在编辑页」或「页面被关掉 / 杀掉」时才需要留着，那两种情况都不会走到这里。
            // （选「不保存」后又半路放弃的，人还在编辑页，草稿也就还在。）
            if (prevState === 'edit' && editingId) { clearDraft(editingId); editingId = null; }
            hideResumePill();
            disablePosSave();
            currentState = newState;
            vHome.classList.add('hidden'); vRead.classList.add('hidden'); vEdit.classList.add('hidden');
            ({ home: vHome, read: vRead, edit: vEdit })[newState].classList.remove('hidden');
            applyChrome(newState);

            if (newState === 'home') {
                renderHomeContinue();
            } else if (newState === 'read') {
                const sameDoc = currentFile.id === lastReadFileId;
                lastReadFileId = currentFile.id;
                lsSet('mdr-last-doc', currentFile.id);
                renderDraftBar();
                if (!(await renderMarkdown(currentFile.content, readerContent))) return;
                if (currentState !== 'read') return;
                generateTOC();
                if (sameDoc && prevState === 'edit') vRead.scrollTop = lastReadScroll;
                else { vRead.scrollTop = 0; offerResume(); }
                updateTocActive();
                enablePosSaveSoon();
            } else if (newState === 'edit') {
                editingId = currentFile.id;
                originalContent = currentFile.content;
                editorTextarea.value = currentFile.content;
                editorTextarea.scrollTop = 0; previewPane.scrollTop = 0;
                setEditTab('edit', false);
                await restoreDraftIfAny();
                previewDirty = true;
                if (previewVisible()) await flushPreview();
            }
        }

        // ================= Action Sheet (底部悬浮菜单) =================
        function showActionMenu(items) {
            actionMenuItems.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `action-item ${item.danger ? 'danger' : ''} ${item.success ? 'success' : ''} ${item.isTitle ? 'title' : ''}`;
                // text 里可能拼着文件名/文件夹名，一律转义；icon 是代码里写死的类名
                div.innerHTML = item.isTitle ? escapeHtml(item.text) : `<i class="${item.icon}"></i> ${escapeHtml(item.text)}`;
                if (!item.isTitle) {
                    div.onclick = () => { closeActionMenu(); item.action(); };
                }
                actionMenuItems.appendChild(div);
            });
            showLayer(actionMenuOverlay);
            actionMenu.classList.add('show');
        }

        function closeActionMenu() {
            hideLayer(actionMenuOverlay);
            actionMenu.classList.remove('show');
        }
        actionMenuOverlay.onclick = closeActionMenu;

        // ================= 侧边栏文件系统 (文件夹渲染与拖拽核心逻辑) =================
        btnSort.innerHTML = sortOrder === 'desc' ?
        '<i class="fas fa-sort-amount-down"></i>' : '<i class="fas fa-sort-amount-up"></i>';
        btnSort.onclick = () => {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            lsSet('md-pro-sort', sortOrder);
            btnSort.innerHTML = sortOrder === 'desc' ? '<i class="fas fa-sort-amount-down"></i>' : '<i class="fas fa-sort-amount-up"></i>';
            renderDrawer();
        };

        let searchQuery = '';
        let folderDragging = false;      // 文件夹拖动进行中：别的标签页改了库也先不重画侧边栏，免得拖到一半元素没了
        let suppressFolderClick = false; // 长按拖动刚结束：随后那一下 click 不算「展开/收起文件夹」
        const coarsePointer = matchMedia('(pointer: coarse)').matches;

        // 一个文件条目（文件夹里、搜索结果里共用）
        function buildFileItem(file, extraLine) {
            const item = document.createElement('div'); item.className = 'history-item' + (extraLine != null ? ' search-hit' : '');
            const pinIcon = file.isPinned ? `<i class="fas fa-thumbtack" style="color:var(--apple-blue); margin-right:6px; font-size:12px; flex-shrink:0;"></i>` : '';
            item.innerHTML = `
                <div class="history-info">
                    <span class="history-title">${pinIcon}<span class="history-name">${escapeHtml(file.title)}</span></span>
                    ${extraLine != null ? `<span class="history-snippet">${escapeHtml(extraLine)}</span>` : ''}
                    <span class="history-date">${new Date(file.timestamp).toLocaleString()}</span>
                </div>
                <button class="history-more-btn" aria-label="更多操作"><i class="fas fa-ellipsis-h"></i></button>
            `;
            item.querySelector('.history-info').onclick = () => openDoc(file.id);
            item.querySelector('.history-more-btn').onclick = (e) => { e.stopPropagation(); showFileMenu(file.id); };
            return item;
        }

        // 侧边栏关着时一律不画（打开时 openDrawer 会先把 drawerOpen 置真再画）：每画一次都要把整个库重新解析一遍，
        // 保存、别的标签页改库（storage 事件）都会来调这里，关着时画了也看不见。
        function renderDrawer() {
            if (!drawerOpen) return;
            let db = getDB();
            historyList.innerHTML = '';
            if (searchQuery) { renderSearchResults(db); return; }

            // 拆分文件夹分类，保证：默认文件夹 -> 置顶文件夹 -> 普通文件夹
            const rootFolder = db.folders.find(f => f.id === 'root');
            const customFolders = db.folders.filter(f => f.id !== 'root');
            const pinnedFolders = customFolders.filter(f => f.isPinned);
            const unpinnedFolders = customFolders.filter(f => !f.isPinned);
            const renderFolders = [rootFolder, ...pinnedFolders, ...unpinnedFolders].filter(Boolean);

            renderFolders.forEach(folder => {
                const group = document.createElement('div');
                group.className = `folder-group ${folder.isOpen ? 'open' : ''}`;
                group.dataset.id = folder.id;

                const header = document.createElement('div');
                header.className = 'folder-header';

                const pinIconStr = folder.isPinned ? 'fa-unlink' : 'fa-thumbtack';
                const pinStyleStr = folder.isPinned ? 'style="color:var(--apple-blue)"' : '';
                const pinBtnHtml = folder.id !== 'root' ? `<button class="folder-btn pin-folder-btn" title="${folder.isPinned ? '取消置顶' : '置顶'}"><i class="fas ${pinIconStr}" ${pinStyleStr}></i></button>` : '';

                header.innerHTML = `
                    <div class="folder-info">
                        <i class="fas fa-chevron-right"></i>
                        <i class="fas fa-folder folder-icon"></i>
                        <span class="folder-name">${escapeHtml(folder.name)}</span>
                    </div>
                    <div class="folder-actions">
                        <button class="folder-btn rename-btn" title="重命名"><i class="fas fa-pen"></i></button>
                        ${pinBtnHtml}
                        ${folder.id !== 'root' ? `<button class="folder-btn del-folder-btn" title="删除"><i class="fas fa-trash-alt"></i></button>` : ''}
                    </div>
                `;
                // 下面所有操作都只记着文件夹 id，动手时在最新的库上找到它再改（见 mutateDB）
                const fid = folder.id;
                header.querySelector('.folder-info').onclick = () => {
                    if (suppressFolderClick) return;
                    mutateDB(db => { const f = db.folders.find(x => x.id === fid); if (!f) return false; f.isOpen = !f.isOpen; });
                };
                header.querySelector('.rename-btn').onclick = async (e) => {
                    e.stopPropagation();
                    const newName = await promptAsk('重命名文件夹', folder.name, '完成');
                    if (newName) mutateDB(db => { const f = db.folders.find(x => x.id === fid); if (!f) return false; f.name = newName; });
                };

                if (folder.id !== 'root') {
                    // 置顶逻辑
                    header.querySelector('.pin-folder-btn').onclick = (e) => {
                        e.stopPropagation();
                        mutateDB(db => { const f = db.folders.find(x => x.id === fid); if (!f) return false; f.isPinned = !f.isPinned; });
                    };

                    // 删除逻辑
                    header.querySelector('.del-folder-btn').onclick = async (e) => {
                        e.stopPropagation();
                        const count = getDB().files.filter(f => f.folderId === fid).length;
                        const ok = count > 0
                            ? await confirmAsk(`删除文件夹「${folder.name}」？`, `里面的 ${count} 个文件会移到「默认文件夹」，不会被删掉。`, '删除', true)
                            : await confirmAsk(`删除空文件夹「${folder.name}」？`, '', '删除', true);
                        if (!ok) return;
                        mutateDB(db => {
                            db.files.forEach(f => { if (f.folderId === fid) f.folderId = 'root'; });
                            db.folders = db.folders.filter(f => f.id !== fid);
                        });
                    };

                    // === 自定义文件夹拖拽排序逻辑 ===
                    // 电脑上用鼠标拖（HTML5 拖放）；触屏上 HTML5 拖放靠不住（iPhone 上基本不触发），改成长按拖动。
                    if (!coarsePointer) {
                        group.draggable = true;
                        group.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', fid);
                            group.classList.add('dragging');
                            folderDragging = true;
                        });
                        group.addEventListener('dragend', () => {
                            group.classList.remove('dragging');
                            folderDragging = false;
                            historyList.querySelectorAll('.folder-group').forEach(el => el.classList.remove('drag-before', 'drag-after'));
                        });
                        group.addEventListener('dragover', (e) => {
                            e.preventDefault();
                            const draggingGroup = historyList.querySelector('.folder-group.dragging');
                            if (draggingGroup && draggingGroup !== group && draggingGroup.dataset.id !== 'root') {
                                const after = dropAfter(draggingGroup, group);
                                group.classList.toggle('drag-after', after);
                                group.classList.toggle('drag-before', !after);
                            }
                        });
                        group.addEventListener('dragleave', () => {
                            group.classList.remove('drag-before', 'drag-after');
                        });
                        group.addEventListener('drop', (e) => {
                            e.preventDefault();
                            e.stopPropagation(); // 别让全局的「拖入文件」处理再接一次
                            group.classList.remove('drag-before', 'drag-after');
                            const draggingGroup = historyList.querySelector('.folder-group.dragging');
                            const draggedId = e.dataTransfer.getData('text/plain');
                            if (!draggingGroup || !draggedId || draggedId === fid || draggedId === 'root') return;
                            reorderFolder(draggedId, fid, dropAfter(draggingGroup, group));
                        });
                    }
                    enableTouchReorder(group, header, fid);
                }

                const filesContainer = document.createElement('div');
                filesContainer.className = 'folder-files';

                let folderFiles = db.files.filter(f => f.folderId === folder.id);
                // === 核心排序逻辑 ===
                folderFiles.sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    return sortOrder === 'desc' ? b.timestamp - a.timestamp : a.timestamp - b.timestamp;
                });

                if (folderFiles.length === 0) {
                    filesContainer.innerHTML = `<div style="padding: 10px 16px 10px 36px; font-size:12px; color:var(--text-secondary);">空文件夹</div>`;
                }

                folderFiles.forEach(file => filesContainer.appendChild(buildFileItem(file)));

                group.appendChild(header); group.appendChild(filesContainer); historyList.appendChild(group);
            });
        }

        // 侧边栏搜索：标题或内容里包含关键词（不分大小写）。标题命中的排前面。
        function renderSearchResults(db) {
            // 用不分大小写的正则直接在原文里找，位置就是原文的位置。原来在 toLowerCase() 之后的文字里找、再拿位置去切原文，
            // 有的字符转小写后长度会变（如土耳其文的 İ），摘要会切歪。
            const re = new RegExp(searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'iu');
            const findCI = (text) => { const m = re.exec(text); return m ? { index: m.index, len: m[0].length } : null; };
            const folderName = id => (db.folders.find(f => f.id === id) || {}).name || '默认文件夹';
            const hits = [];
            db.files.forEach(file => {
                const title = String(file.title || ''), content = String(file.content || '');
                const inTitle = !!findCI(title);
                const m = findCI(content);
                if (!inTitle && !m) return;
                let line = folderName(file.folderId);
                if (m) {
                    const start = Math.max(0, m.index - 12);
                    line += ' · ' + (start > 0 ? '…' : '') + content.slice(start, m.index + m.len + 30).replace(/\s+/g, ' ');
                }
                hits.push({ file, inTitle, line });
            });
            hits.sort((a, b) => (b.inTitle - a.inTitle) || (b.file.timestamp - a.file.timestamp));
            if (!hits.length) {
                const empty = document.createElement('div'); empty.className = 'search-empty';
                empty.textContent = `没有找到包含「${searchQuery}」的文档`;
                historyList.appendChild(empty);
                return;
            }
            hits.forEach(h => historyList.appendChild(buildFileItem(h.file, h.line)));
        }
        // 打字停顿 150ms 再搜：每搜一次要把整个库解析一遍、再逐篇查全文，库接近 5MB 时手机上每个按键都会卡
        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            searchClear.classList.toggle('hidden', !searchInput.value);
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { searchQuery = searchInput.value.trim(); renderDrawer(); }, 150);
        });
        searchClear.onclick = () => {
            clearTimeout(searchTimer);
            searchInput.value = ''; searchQuery = '';
            searchClear.classList.add('hidden');
            renderDrawer();
            searchInput.focus();
        };

        // 拖动方向：被拖的在目标上面（往下拖）→ 插到目标后面；反之插到前面。蓝线画在对应的一侧。
        // 原来蓝线一律画在目标上方，往下拖时实际却插到了后面（P3-18）。
        function dropAfter(draggedGroup, targetGroup) {
            const groups = Array.from(historyList.children);
            return groups.indexOf(draggedGroup) < groups.indexOf(targetGroup);
        }
        function reorderFolder(draggedId, targetId, after) {
            if (draggedId === targetId || draggedId === 'root' || targetId === 'root') return;
            mutateDB(db => {
                const from = db.folders.findIndex(f => f.id === draggedId);
                if (from < 0 || !db.folders.some(f => f.id === targetId)) return false;
                const [moved] = db.folders.splice(from, 1);
                const to = db.folders.findIndex(f => f.id === targetId);
                // 置顶的文件夹总排在普通文件夹前面：拖进置顶区就跟着置顶，拖出来就取消置顶，不然松手后看起来没动
                moved.isPinned = !!db.folders[to].isPinned;
                db.folders.splice(after ? to + 1 : to, 0, moved);
            });
        }

        // 触屏：在文件夹标题上按住 0.45 秒（手指没动）→ 拎起来跟着手指走 → 松手放到蓝线处。
        // 按住期间手指一动就算滚动，不拎起。
        function enableTouchReorder(group, header, fid) {
            let timer = null, startX = 0, startY = 0, dragging = false, target = null, after = false;
            const clearMarks = () => { if (target) target.classList.remove('drag-before', 'drag-after'); };
            header.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1 || e.target.closest('.folder-btn')) return;
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    timer = null; dragging = true; folderDragging = true; suppressFolderClick = true;
                    group.classList.add('touch-dragging');
                    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (_) {} }
                }, 450);
            }, { passive: true });
            header.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                if (timer) {
                    if (Math.hypot(t.clientX - startX, t.clientY - startY) > 8) { clearTimeout(timer); timer = null; }
                    return;
                }
                if (!dragging) return;
                e.preventDefault(); // 拎起之后这一路手势不再滚动侧边栏
                group.style.transform = `translateY(${t.clientY - startY}px)`;
                // 先让自己不接收点击，elementFromPoint 才能看到手指下面的那个文件夹
                group.style.pointerEvents = 'none';
                const under = document.elementFromPoint(t.clientX, t.clientY);
                group.style.pointerEvents = '';
                const tg = under && under.closest('.folder-group');
                clearMarks(); target = null;
                if (tg && tg !== group && historyList.contains(tg) && tg.dataset.id !== 'root') {
                    target = tg; after = dropAfter(group, tg);
                    tg.classList.add(after ? 'drag-after' : 'drag-before');
                }
                // 拖到侧边栏上下边缘时自动滚一点
                const r = drawerContent.getBoundingClientRect();
                if (t.clientY < r.top + 40) drawerContent.scrollTop -= 8;
                else if (t.clientY > r.bottom - 40) drawerContent.scrollTop += 8;
            }, { passive: false });
            const end = () => {
                clearTimeout(timer); timer = null;
                if (!dragging) return;
                dragging = false; folderDragging = false;
                group.classList.remove('touch-dragging'); group.style.transform = '';
                const tgt = target; clearMarks(); target = null;
                setTimeout(() => { suppressFolderClick = false; }, 400);
                if (tgt) reorderFolder(fid, tgt.dataset.id, after);
            };
            header.addEventListener('touchend', end);
            header.addEventListener('touchcancel', end);
            // 安卓长按会弹系统菜单，拖动时不要它
            header.addEventListener('contextmenu', (e) => { if (dragging || suppressFolderClick) e.preventDefault(); });
        }

        // 文件的「…」菜单。只记着 id，每个动作都在最新的库上找到它再改。
        function showFileMenu(id) {
            const file = getDB().files.find(f => f.id === id);
            if (!file) { renderDrawer(); return; }
            showActionMenu([
                { text: `对 "${file.title}" 进行操作`, isTitle: true },
                { text: '重命名文档', icon: 'fas fa-pen', action: () => renameFile(id) },
                { text: '下载为 .md 文件', icon: 'fas fa-download', action: () => { const f = getDB().files.find(x => x.id === id); if (f) downloadDoc(f); } },
                { text: file.isPinned ? '取消置顶' : '置顶文档', icon: `fas ${file.isPinned ? 'fa-unlink' : 'fa-thumbtack'}`, action: () => {
                    mutateDB(db => { const f = db.files.find(x => x.id === id); if (!f) return false; f.isPinned = !f.isPinned; });
                }},
                { text: '移动到...', icon: 'fas fa-exchange-alt', action: () => {
                    const db = getDB();
                    const cur = db.files.find(x => x.id === id);
                    if (!cur) return;
                    let moveOptions = [{ text: '选择目标文件夹', isTitle: true }];
                    db.folders.forEach(targetFolder => {
                        if (targetFolder.id !== cur.folderId) {
                            const tid = targetFolder.id;
                            moveOptions.push({
                                text: targetFolder.name, icon: 'fas fa-folder',
                                action: () => mutateDB(db => {
                                    const f = db.files.find(x => x.id === id), t = db.folders.find(x => x.id === tid);
                                    if (!f || !t) return false;
                                    f.folderId = tid; t.isOpen = true;
                                })
                            });
                        }
                    });
                    setTimeout(() => showActionMenu(moveOptions), 350);
                }},
                { text: '删除文档', icon: 'fas fa-trash-alt', danger: true, action: () => deleteFile(id) }
            ]);
        }

        async function renameFile(id) {
            const file = getDB().files.find(f => f.id === id);
            if (!file) return;
            const newTitle = await promptAsk('重命名文档', file.title, '完成');
            if (!newTitle) return;
            if (!mutateDB(db => { const f = db.files.find(x => x.id === id); if (!f) return false; f.title = newTitle; })) return;
            if (currentFile && currentFile.id === id) {
                currentFile.title = newTitle;
                headerUI.headerTitle.textContent = currentState === 'edit' ? "编辑: " + newTitle : newTitle;
            }
        }

        async function deleteFile(id) {
            const file = getDB().files.find(f => f.id === id);
            if (!file) return;
            const editingIt = currentState === 'edit' && currentFile && currentFile.id === id;
            if (!(await confirmAsk(`删除文档「${file.title}」？`, editingIt ? '删除后无法恢复，正在编辑的修改也会一起丢弃。' : '删除后无法恢复。', '删除', true))) return;
            if (!mutateDB(db => { db.files = db.files.filter(f => f.id !== id); })) return;
            clearDraft(id); removeReadPos(id);
            if (lsGet('mdr-last-doc') === id) lsRemove('mdr-last-doc');
            if (currentFile && currentFile.id === id) {
                currentFile = null; lastReadFileId = null;
                switchState('home');
                if (isMobileWidth()) closeDrawer();
            }
        }

        // ================= 顶部全局事件监听 =================
        document.getElementById('btn-new-folder').onclick = async () => {
            const name = await promptAsk('新建文件夹', '', '创建', '文件夹名称');
            if (name) mutateDB(db => { db.folders.push({ id: 'folder_' + newId(), name, isOpen: true, isPinned: false }); });
        };

        let tooltipTimer;
        // 双击标题回到顶部。窗口内的第二击算双击，窗口外走原来的 tooltip toggle 逻辑。
        const TITLE_DBLCLICK_MS = 300;
        // 双击时 tooltip 已经弹出来了，这里不去撤销它——"弹出后被瞬间抹掉"才是刺眼的
        // 那一闪，而让它自然淡出就只是一次正常的显示。代价只是文件名多停留一会儿，
        // 换来的是单击不需要任何淡入延迟（延迟期间画面毫无变化，点下去像没反应）。
        // 停留时长按回顶动画（实测 0.93~1.09s）取整，滚动停下时它也差不多淡完。
        const DBL_TOOLTIP_LINGER_MS = 900;
        let titleClickTimer = null;

        const scrollReaderToTop = () => {
            if (currentState !== 'read') return;
            vRead.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const toggleTitleTooltip = () => {
            if (titleTooltip.classList.contains('show')) { titleTooltip.classList.remove('show'); clearTimeout(tooltipTimer); return; }
            // 文件名来自用户本机任意 .md，这条路径不经过 marked 的 DOMPurify 管线，
            // 所以只能走 textContent，绝不能拼 innerHTML（形如
            // <img src=x onerror=...>.md 的文件名会被执行）。
            titleTooltip.textContent = currentFile.title;
            titleTooltip.classList.add('show');
            clearTimeout(tooltipTimer); tooltipTimer = setTimeout(() => { titleTooltip.classList.remove('show'); }, 3000);
        };

        headerUI.headerTitle.onclick = () => {
            if (!currentFile) return;
            // 阅读视图之外（编辑模式）完全走原来的路径，行为不变。
            if (currentState !== 'read') { toggleTitleTooltip(); return; }

            if (titleClickTimer) {           // 窗口内的第二击 → 双击
                clearTimeout(titleClickTimer);
                titleClickTimer = null;
                // 不撤销 tooltip，只把它的停留时间缩短：双击的意图是回顶不是看文件名。
                clearTimeout(tooltipTimer);
                tooltipTimer = setTimeout(() => { titleTooltip.classList.remove('show'); }, DBL_TOOLTIP_LINGER_MS);
                scrollReaderToTop();
                return;
            }
            toggleTitleTooltip();            // 第一击照常，零延迟
            titleClickTimer = setTimeout(() => { titleClickTimer = null; }, TITLE_DBLCLICK_MS);
        };
        titleTooltip.onclick = () => titleTooltip.classList.remove('show');
        document.addEventListener('click', (e) => {
            if (!titleTooltip.classList.contains('show')) return;
            if (titleTooltip.contains(e.target) || headerUI.headerTitle.contains(e.target)) return;
            titleTooltip.classList.remove('show');
            clearTimeout(tooltipTimer);
        });

        headerUI.btnReadMore.onclick = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            showActionMenu([
                { text: '编辑文档', icon: 'fas fa-edit', action: () => switchState('edit') },
                { text: '复制全文', icon: 'fas fa-copy', action: () => copyContent(null) },
                { text: '下载为 .md 文件', icon: 'fas fa-download', action: () => downloadCurrent() },
                { text: '放大字号', icon: 'fas fa-plus', action: () => changeFontScale(0.1) },
                { text: '缩小字号', icon: 'fas fa-minus', action: () => changeFontScale(-0.1) },
                { text: '恢复默认字号', icon: 'fas fa-rotate-left', action: () => resetFontScale() },
                { text: showLineNumbers ? '隐藏代码行号' : '显示代码行号', icon: 'fas fa-list-ol', action: () => toggleLineNumbers() },
                { text: isDark ? '浅色模式' : '深色模式', icon: isDark ? 'fas fa-sun' : 'fas fa-moon', action: () => toggleTheme() },
                { text: '返回主页', icon: 'fas fa-home', action: () => switchState('home'), danger: true }
            ]);
        };

        headerUI.btnEditMore.onclick = () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            showActionMenu([
                { text: '保存修改', icon: 'fas fa-save', action: () => saveEdit(), success: true },
                { text: '重置内容', icon: 'fas fa-undo', action: () => resetEdit() },
                { text: isDark ? '浅色模式' : '深色模式', icon: isDark ? 'fas fa-sun' : 'fas fa-moon', action: () => toggleTheme() },
                { text: '放弃修改', icon: 'fas fa-times', action: () => cancelEdit(), danger: true }
